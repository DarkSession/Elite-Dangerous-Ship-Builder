<ednb-app-frame
  [routeContext]="pageName()"
  [routeCount]="pageCount()"
  [tools]="tools()"
  [home]="home()"
  [actions]="actions()"
  [status]="updateStatus()"
  [back]="back()"
  [identity]="identity()"
  (actionSelected)="selectAction($event)"
  (identityOpened)="chrome.openIdentity($event)"
  (identityClosed)="chrome.closeIdentity()"
  (identityCommitted)="chrome.commitIdentity($event)"
  (navigationSelected)="navigateFromShell($event)"
  (toolSelected)="navigateFromShell($event)"
>
  <!--
    A cold arrival at any address waits for that screen's own chunk, and the
    frame around it is already drawn. The skeleton holds the room the screen
    will take, so the page it lands in was never blank (011/FR-029).

    Only while nothing is activated. Moving between two screens keeps the one a
    Commander is reading until the next is ready, and a skeleton over that would
    take away a screen to show that another is coming.
  -->
  @if (routeWaiting()) {
    <ednb-skeleton [label]="routePendingNotice()" [lines]="6" />
  } @else if (routeFailed()) {
    <!--
      The chunk did not arrive, and there is no screen behind this to fall back
      to. A skeleton taken down over an empty frame says nothing at all, which
      is the one thing a frame that failed must not do.
    -->
    <ednb-status-notice tone="error" [message]="routeFailedNotice()" />
  }

  <router-outlet (activate)="routeActivated()" />
</ednb-app-frame>

<!--
  Loaded when a Commander asks for one, not before. Both layers are deferred
  together because they share the store the shell already holds, and because
  the first of them to be opened pays the load either way.
-->
@defer (when exchangeWanted()) {
  <ednb-slef-import-dialog />
  <ednb-slef-export-dialog />
} @loading (after 200ms; minimum 400ms) {
  <!--
    The layer a Commander asked for, standing where it will stand, while the
    chunk that draws it is fetched. It waits 200 milliseconds first: a layer
    that appeared and vanished inside one frame would be worse than a press
    that takes a moment (011/FR-029).

    It closes. Pressing the way out here cancels the opening rather than the
    fetch, so the layer that arrives a moment later arrives closed.

    At the width of the layer it stands in for, so the panel a Commander is
    looking at is the size of the one that lands. Its body keeps the layer's own
    inset: what the panel holds changes wholesale when the chunk arrives, and a
    skeleton against the panel edge is not what the inset is for.
  -->
  <ednb-layer
    [open]="exchangeWanted()"
    [title]="exchangePendingTitle()"
    [width]="exchangePendingWidth()"
    [dismissLabel]="dismissLabel()"
    (dismissed)="cancelExchange()"
  >
    <ednb-skeleton [label]="layerPendingNotice()" />
  </ednb-layer>
} @error {
  <!--
    The chunk did not arrive. The layer says so and offers the way out, because
    the block does not try again: without this the layer a Commander asked for
    would close on its own and the control that opened it would do nothing for
    the rest of the session (011/FR-029).
  -->
  <ednb-layer
    [open]="exchangeWanted()"
    [title]="exchangePendingTitle()"
    [width]="exchangePendingWidth()"
    [dismissLabel]="dismissLabel()"
    (dismissed)="cancelExchange()"
  >
    <ednb-status-notice tone="error" [message]="layerFailedNotice()" />
  </ednb-layer>
}

<!--
  The saved builds, as the layer canvas 1a draws: over the screen a Commander is
  on, with that screen inert behind it rather than replaced by it. Mounted here
  beside the frame for the same reason help is — the list of stored builds
  belongs to no screen in particular — and deferred, because a Commander who
  never opens it should never pay for it.

  It has no address of its own. Opening it takes a history entry at the address
  a Commander is already on, so the back button closes it and the screen behind
  survives — a saved build is something you reach for from wherever you are
  rather than somewhere you go (Commander request 2026-09-04).
-->
@defer (when library.open()) {
  @if (library.open()) {
    <ednb-build-library-page />
  }
} @loading (after 200ms; minimum 400ms) {
  <!--
    The widest measure, which is the library's own. A narrower placeholder would
    widen under the hand when the chunk lands.
  -->
  <ednb-layer
    [open]="library.open()"
    [title]="libraryPendingTitle()"
    width="widest"
    [dismissLabel]="dismissLabel()"
    (dismissed)="library.lower()"
  >
    <ednb-skeleton [label]="layerPendingNotice()" />
  </ednb-layer>
} @error {
  <ednb-layer
    [open]="library.open()"
    [title]="libraryPendingTitle()"
    width="widest"
    [dismissLabel]="dismissLabel()"
    (dismissed)="library.lower()"
  >
    <ednb-status-notice tone="error" [message]="layerFailedNotice()" />
  </ednb-layer>
}

<!--
  The one Help · About modal, mounted beside the frame and never inside a
  capability. It is eager, not deferred: help has to open on the first offline
  visit after one completed load, and a chunk fetched on activation is a
  request waiting to fail (012/FR-001).
-->
<ednb-help-dialog
  [open]="help.open()"
  [view]="help.view()"
  [dismissLabel]="help.dismissLabel()"
  (dismissed)="help.closeDialog()"
/>

<!--
  The overlay a newer version puts up before it restarts the page under it.
  Mounted beside the frame rather than inside a capability, because the version
  a session is running belongs to no screen in particular.

  It is a layer with no dismiss label, which is what leaves it with no control,
  no Escape and no ground to click: the restart is announced rather than asked
  about, so there is nothing here to answer. That is a time limit a Commander
  cannot stop, and constitution V names WCAG 2.2.1 among the excluded criteria
  for this one mechanism.
-->
<ednb-layer
  [open]="updateOverlay()"
  [title]="updateOverlayTitle()"
  [description]="updateOverlayNotice()"
  [dismissLabel]="null"
/>

<!--
  And the other half of the announcement, drawn by the session that came up on
  the newer version. The overlay above is gone with the page that drew it; this
  is the half a Commander who looked away is certain to read, and it names the
  version they landed on. Dismissed like any other layer, and after a few
  seconds by itself as well — nothing is pending behind it, because the update
  is already applied.
-->
<ednb-layer
  [open]="updateApplied()"
  [title]="updateAppliedTitle()"
  [description]="updateAppliedNotice()"
  [dismissLabel]="updateAppliedDismiss()"
  (dismissed)="acknowledgeUpdate()"
>
  <p class="app__update-detail">{{ updateAppliedDetail() }}</p>
</ednb-layer>
