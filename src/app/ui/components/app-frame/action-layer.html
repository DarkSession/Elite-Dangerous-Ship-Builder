<button
  class="action-layer__trigger"
  type="button"
  [id]="triggerId"
  [attr.aria-expanded]="expanded() ? 'true' : 'false'"
  [attr.aria-controls]="layerId"
  [disabled]="disabled()"
  (click)="toggle()"
>
  <!--
    Canvas 1d draws the mark and no word: the folded bar is one row
    already carrying a build's name, and there is no room for a fourth phrase.
    The mark is hidden and the name is carried as text inside the control, so
    the button is named by words in the accessibility tree and drawn as the
    canvas draws it (011 shell design, ruled 2026-08-26).
  -->
  <span class="action-layer__trigger-mark" aria-hidden="true">&#8942;</span>
  <span class="action-layer__trigger-label">{{ triggerLabel() }}</span>
</button>

<div
  class="action-layer__panel"
  role="group"
  [id]="layerId"
  [attr.aria-label]="label()"
  [attr.aria-labelledby]="triggerId"
  [hidden]="!expanded()"
>
  <!--
    Canvas 1d's `⋮` menu is one list: `SAVE`, then the history pair, then
    `IMPORT · EXPORT`, then `HELP & FAQ`. The screens a Commander can move to
    are part of that list at this width, not a second row of chips under the
    bar — the folded bar is one row and nothing else.
  -->
  @if (links().length > 0) {
    <nav class="action-layer__navigation" [attr.aria-label]="linksLabel()">
      @for (entry of links(); track entry.id) {
        <a
          class="action-layer__link"
          [href]="entry.href"
          [attr.aria-current]="entry.current ? 'page' : null"
          (click)="linkSelected.emit({ entry, event: $event })"
        >
          {{ entry.label }}
        </a>
      }
    </nav>
  }

  @for (action of actions(); track action.id) {
    <!--
      The canvas rules its groups apart and leaves the rows inside a group
      unruled — `SAVE │ UNDO REDO │ IMPORT EXPORT │ HELP`. That is the same
      grouping the wide bar draws with its hairline, so it is read from the
      same flag rather than counted out again here.
    -->
    @if (action.startsGroup || ($first && links().length > 0)) {
      <span class="action-layer__rule" aria-hidden="true"></span>
    }
    <edsb-action-button
      row
      [label]="action.label"
      [emphasis]="action.emphasis ?? 'secondary'"
      [disabled]="disabled() || (action.disabled ?? false)"
      [description]="action.description ?? null"
      (activated)="select(action)"
    />
  }
</div>
