<span class="game-text">
  @if (label()) {
    <span class="game-text__label">{{ label() }}</span>
  }

  @if (isUnavailable()) {
    <span class="game-text__unavailable">{{ unavailableText() }}</span>
  } @else {
    <span
      #value
      class="game-text__value"
      data-bidi-isolate
      [attr.lang]="language()"
      [attr.dir]="'auto'"
      [attr.aria-describedby]="isCanonical() ? disclosureId : null"
      >{{ text() }}</span
    >
    <!--
      A mark about the drawing of the value, beside the value. The ledger cuts a
      name and projects the ellipsis that stands for the rest of it here, where
      it lands against the text it abbreviates.
    -->
    <ng-content />

    @if (isCanonical()) {
      <span class="game-text__disclosure" [id]="disclosureId">{{ disclosure() }}</span>
    }
  }
</span>
