<section class="manager" [attr.aria-labelledby]="managerId">
  <h3 class="manager__title" [id]="managerId">{{ title() }}</h3>

  @if (reason(); as why) {
    <p class="manager__reason">{{ why }}</p>
  }

  <p class="manager__description">{{ description() }}</p>

  @if (records().length > 0) {
    <ednb-choice-group
      [legend]="title()"
      [choices]="choices()"
      [selected]="selected()"
      kind="checkbox"
      (changed)="selectionChanged.emit($event)"
    />

    <ednb-action-button
      [label]="discardLabel()"
      emphasis="danger"
      [disabled]="!hasSelection()"
      (activated)="discardRequested.emit(selected())"
    />
  } @else {
    <p class="manager__empty">{{ emptyLabel() }}</p>
  }
</section>
