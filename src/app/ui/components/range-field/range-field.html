<!--
  The canvas's own order since its 2026-08-25 revision: the label and the value
  it is set to on one row, the track beneath them, and the ends of the scale
  under that. The value moved off the track's trailing side and onto the row
  above it, which is also the order a reader hears — what this is, what it says,
  then the control that changes it.
-->
<div class="range">
  <label class="range__label" [id]="relations.labelId" [attr.for]="relations.controlId">
    {{ label() }}
  </label>

  <output class="range__value" [attr.for]="relations.controlId" data-bidi-isolate>
    {{ valueText() }}
  </output>

  <span class="range__track">
    <!--
      The fill behind the thumb, which the canvas draws and which carries no
      reading of its own: the figure beside the slider is what it was drawn
      from, and the slider already reports the same value itself.
    -->
    <span class="range__fill" aria-hidden="true" [style.inline-size.%]="fraction() * 100"></span>

    <input
      #control
      type="range"
      class="range__control"
      [id]="relations.controlId"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="value()"
      [attr.aria-valuetext]="valueText()"
      [attr.aria-describedby]="relations.describedBy()"
      [disabled]="disabled()"
      (input)="onInput($event)"
    />
  </span>

  @if (minText() && maxText()) {
    <!--
      The ends of the scale, as the canvas prints them under its track. Hidden
      from assistive technology because the slider states its own minimum and
      maximum, and hearing each end twice says nothing the first did not.
    -->
    <span class="range__scale" aria-hidden="true">
      <span>{{ minText() }}</span>
      <span>{{ maxText() }}</span>
    </span>
  }

  @if (description()) {
    <p class="range__description" [id]="relations.descriptionId">{{ description() }}</p>
  }
</div>
