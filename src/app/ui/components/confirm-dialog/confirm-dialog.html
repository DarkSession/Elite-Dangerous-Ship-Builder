<ednb-layer
  [open]="open()"
  [title]="title()"
  [description]="description()"
  [dismissLabel]="dismissLabel()"
  presentation="adaptive"
  (dismissed)="cancelled.emit()"
>
  <div class="confirm__actions">
    <ednb-action-button
      [label]="confirmLabel()"
      [emphasis]="destructive() ? 'danger' : 'primary'"
      (activated)="confirmed.emit()"
    />
    <ednb-action-button [label]="cancelLabel()" emphasis="quiet" (activated)="cancelled.emit()" />
  </div>
</ednb-layer>
