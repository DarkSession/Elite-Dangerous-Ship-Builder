<!--
  `click` on the dialog itself is the backdrop: a click inside the panel is
  reported against whatever it landed on, and only the ground around the panel
  reaches the element. The reference wires exactly this on both of its modals
  (`modal.addEventListener('click', e => { if (e.target === modal) close(); })`).
-->
<dialog
  [class]="presentationClass()"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="describedBy()"
  (cancel)="blockCancel($event)"
  (close)="closed()"
  (mousedown)="pressOn($event)"
  (click)="dismissFromBackdrop($event)"
>
  <div class="layer__header">
    <div class="layer__identity">
      <h2 class="layer__title" [id]="titleId">{{ title() }}</h2>
      <!--
        The subject's own label, in the bar with the title rather than under it.
        A name is part of what the bar says the screen is about; a paragraph is
        not, and stays below (`description`).
      -->
      @if (detail(); as detail) {
        <p class="layer__detail" [id]="detailId">{{ detail }}</p>
      }
    </div>
    @if (dismissible()) {
      <button class="layer__dismiss" type="button" (click)="dismiss()">
        {{ dismissLabel() }}
      </button>
    }
  </div>

  @if (description()) {
    <p class="layer__description" [id]="descriptionId">{{ description() }}</p>
  }

  <div [class]="bodyClass()">
    <ng-content />
  </div>
</dialog>
