<button
  type="button"
  [class]="classes()"
  [disabled]="disabled()"
  [attr.aria-busy]="busy() ? 'true' : null"
  [attr.aria-pressed]="isToggle() ? (pressed() ? 'true' : 'false') : null"
  [attr.aria-label]="accessibleName() === label() ? null : accessibleName()"
  [attr.aria-describedby]="description() ? descriptionId : null"
  (click)="activate()"
>
  <!--
    The mark and the name, never one or the other. Where a caller supplies a
    conventional mark it is what is drawn and the name goes on being carried as
    text, so the accessible name is the same string either way and nothing has
    to be inferred from a shape.
  -->
  @if (symbol(); as only) {
    <span class="action__symbol" aria-hidden="true">{{ only }}</span>
    <span class="visually-hidden">{{ label() }}</span>
  } @else {
    @if (mark(); as beside) {
      @if (markPosition() === 'leading') {
        <span class="action__mark" aria-hidden="true">{{ beside }}</span>
      }
      <span class="action__label">{{ label() }}</span>
      @if (markPosition() === 'trailing') {
        <span class="action__mark" aria-hidden="true">{{ beside }}</span>
      }
    } @else {
      <span class="action__label">{{ label() }}</span>
    }
  }
</button>

<!--
  Beside the control rather than inside it. Text inside a button with no
  `aria-label` becomes part of its accessible name, and the name is the label a
  Commander reads aloud — the description says what the control would do, which
  is a different thing and belongs in `aria-describedby`.
-->
@if (description(); as text) {
  <span class="visually-hidden" [id]="descriptionId">{{ text }}</span>
}
