<div class="note">
  <edsb-textarea-field
    [label]="label()"
    [value]="note() ?? ''"
    [description]="description()"
    [disabled]="disabled()"
    (changed)="onChanged($event)"
  />
  <edsb-action-button
    [label]="saveLabel()"
    emphasis="secondary"
    [disabled]="disabled()"
    (activated)="save()"
  />
</div>
