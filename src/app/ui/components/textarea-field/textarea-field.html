<div class="field">
  <!-- Written into the markup rather than bound, for the reason `text-field.html` gives. -->
  @if (labelHidden()) {
    <label
      class="field__label field__label--hidden"
      [id]="relations.labelId"
      [attr.for]="relations.controlId"
    >
      {{ label() }}
    </label>
  } @else {
    <label class="field__label" [id]="relations.labelId" [attr.for]="relations.controlId">
      {{ label() }}
    </label>
  }

  <textarea
    class="field__control"
    [class.field__control--technical]="technical()"
    [attr.data-bidi-isolate]="technical() ? '' : null"
    [id]="relations.controlId"
    [rows]="rows()"
    [value]="value()"
    [attr.required]="required() ? '' : null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="relations.invalid() ? 'true' : null"
    [attr.aria-describedby]="relations.describedBy()"
    [attr.aria-busy]="busy() ? 'true' : null"
    [disabled]="disabled()"
    [readOnly]="readonlyValue()"
    (input)="onInput($event)"
  ></textarea>

  @if (description()) {
    <p class="field__description" [id]="relations.descriptionId">{{ description() }}</p>
  }

  @if (error()) {
    <p class="field__error" [id]="relations.errorId">{{ error() }}</p>
  }
</div>
