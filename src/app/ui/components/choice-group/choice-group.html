<fieldset
  class="choice-group"
  [disabled]="disabled()"
  [attr.aria-invalid]="relations.invalid() ? 'true' : null"
  [attr.aria-describedby]="relations.describedBy()"
>
  <!--
    Two legends rather than one with a bound class. Angular re-initialises
    `[class.x]` bindings on the first pass after it takes over a rendered
    document, and for one frame the class is off the element — measured on
    `/ships`, this legend stood up to its full 12px and pushed all 48 hulls down
    16 pixels before sitting back down (015/FR-009, SC-003). A class written into
    the markup is claimed by the takeover and never rewritten.
  -->
  @if (legendHidden()) {
    <legend class="choice-group__legend field__label--hidden">{{ legend() }}</legend>
  } @else {
    <legend class="choice-group__legend">{{ legend() }}</legend>
  }

  <div
    class="choice-group__options"
    [attr.data-layout]="layout()"
    [attr.data-cards]="isCards() ? '' : null"
  >
    @for (choice of choices(); track choice.value) {
      <div class="choice">
        <input
          class="choice__input"
          [id]="choiceId(choice.value)"
          [type]="inputType()"
          [attr.role]="role()"
          [attr.name]="isMultiple() ? null : groupName"
          [checked]="isSelected(choice.value)"
          [attr.aria-checked]="role() ? (isSelected(choice.value) ? 'true' : 'false') : null"
          [attr.aria-describedby]="choice.description ? choiceDescriptionId(choice.value) : null"
          [disabled]="(choice.disabled ?? false) || disabled()"
          (change)="toggle(choice.value)"
        />
        <!--
          The mark canvas 1c draws on each save mode: an open square on the
          offer, a filled one on the choice that stands. `aria-hidden`, because
          the control's own checked state already says it and a reader hearing
          it twice is told nothing more.
        -->
        @if (hasMarker()) {
          <span class="choice__marker" aria-hidden="true"></span>
        }
        <label class="choice__label" [attr.for]="choiceId(choice.value)">{{ choice.label }}</label>
        @if (choice.description) {
          <p class="choice__description" [id]="choiceDescriptionId(choice.value)">
            {{ choice.description }}
          </p>
        }
      </div>
    }
  </div>

  @if (description()) {
    <p class="field__description" [id]="relations.descriptionId">{{ description() }}</p>
  }

  @if (error()) {
    <p class="field__error" [id]="relations.errorId">{{ error() }}</p>
  }
</fieldset>
