<!--
  A button, because choosing a row is an action and the footer acts on what was
  chosen. Its accessible name is the row's own words rather than an `aria-label`
  over the top of them: a name that replaced the visible text would be a name a
  Commander reading aloud could not match to what they see (WCAG 2.5.3). What
  the plate and the marker say without words is added as text of its own.
-->
<button
  type="button"
  class="record"
  [class.record--chosen]="chosen()"
  [attr.aria-current]="build().current ? 'true' : null"
  [attr.aria-pressed]="chosen() ? 'true' : 'false'"
  [attr.data-record-current]="build().current ? 'true' : null"
  (click)="choose()"
>
  <span class="record__identity">
    <span class="record__title-row">
      <span class="record__title" [class.record__title--derived]="!build().named">
        {{ build().title }}
      </span>

      @if (build().issues; as issues) {
        <span class="record__issues" aria-hidden="true">{{ issues.count }}</span>
        <span class="visually-hidden">{{ issues.label }}</span>
      }
    </span>

    @if (build().note; as note) {
      <span class="record__note">{{ note }}</span>
    }

    <!--
      Three facts the canvas does not draw, kept where a reader can still get
      them (Commander request 2026-08-26).

      The row it drew them on carried `Current build`, `Valid` and
      `Deleted in 6 days` beneath the title, which is three lines of chrome on
      every row of a library the canvas draws as four dense columns. Each is
      already said by something the canvas *does* draw: the row the workspace
      holds is the one on the amber edge, and it is `aria-current` besides; a
      build with issues carries their count on a warm plate beside its title,
      and a build with none carries nothing, which is what a clean build looks
      like. So they stay as text and stop being ink.

      The remaining life is the one that loses something real. FR-013 accepted
      a record vanishing on a clock because FR-010 put the countdown on the
      row — that notice is now read aloud rather than drawn, and a Commander
      who does not use a screen reader sees a record's last days only if they
      go looking. The request was explicit and the spec records the trade.
    -->
    <span class="record__states">
      @if (build().current) {
        <span>{{ build().currentLabel }}</span>
      }
      <span>{{ build().validation.label }}</span>
      @if (build().remaining; as remaining) {
        <span>{{ remaining }}</span>
      }
    </span>
  </span>

  <span class="record__hull">
    <edsb-game-text
      [text]="build().hull.text"
      [language]="build().hull.language"
      [translationState]="build().hull.translationState"
    />
  </span>

  <span class="record__modified">{{ build().modified }}</span>

  <!-- The verb, after the row's own words rather than instead of them. -->
  <span class="visually-hidden">{{ build().chooseLabel }}</span>
</button>
