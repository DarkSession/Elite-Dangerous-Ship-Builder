<!--
  A button, because choosing a row is an action and the footer acts on what was
  chosen. Its accessible name is the row's own words rather than an `aria-label`
  over the top of them: a name that replaced the visible text would be a name a
  Commander reading aloud could not match to what they see (WCAG 2.5.3). What
  the plate and the marker say without words is added as text of its own.
-->
<button
  type="button"
  class="record"
  [class.record--chosen]="chosen()"
  [attr.aria-current]="build().current ? 'true' : null"
  [attr.aria-pressed]="chosen() ? 'true' : 'false'"
  [attr.data-record-current]="build().current ? 'true' : null"
  (click)="choose()"
>
  <span class="record__identity">
    <span class="record__title-row">
      <span class="record__title" [id]="cardId" [class.record__title--derived]="!build().named">
        {{ build().title }}
      </span>

      @if (build().issues; as issues) {
        <span class="record__issues" aria-hidden="true">{{ issues.count }}</span>
        <span class="visually-hidden">{{ issues.label }}</span>
      }
    </span>

    @if (build().note; as note) {
      <span class="record__note">{{ note }}</span>
    }

    <span class="record__states">
      @if (build().current) {
        <span class="record__current">{{ build().currentLabel }}</span>
      }
      <span class="record__validation record__validation--{{ build().validation.tone }}">
        {{ build().validation.label }}
      </span>
      @if (build().remaining; as remaining) {
        <span class="record__remaining">{{ remaining }}</span>
      }
    </span>
  </span>

  <span class="record__hull">
    <edsb-game-text
      [text]="build().hull.text"
      [language]="build().hull.language"
      [translationState]="build().hull.translationState"
    />
  </span>

  <span class="record__modified">{{ build().modified }}</span>

  <!-- The verb, after the row's own words rather than instead of them. -->
  <span class="visually-hidden">{{ build().chooseLabel }}</span>
</button>
