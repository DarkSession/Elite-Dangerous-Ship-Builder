@if (labelVisible()) {
  <!--
    The canvas's own caption in front of the strip. It is the group's name
    rather than a decoration beside it, so the words a reader sees and the
    words a screen reader announces are the same words by construction.
  -->
  <span class="tab-group__label" [id]="labelId">{{ label() }}</span>
}

<div
  class="tab-group"
  [class.tab-group--segmented]="!isTabs()"
  [attr.role]="isTabs() ? 'tablist' : 'group'"
  [attr.aria-label]="labelVisible() ? null : label()"
  [attr.aria-labelledby]="labelVisible() ? labelId : null"
>
  @for (tab of tabs(); track tab.id) {
    <button
      class="tab"
      type="button"
      [id]="tab.id"
      [attr.role]="isTabs() ? 'tab' : null"
      [attr.aria-selected]="isTabs() ? (isSelected(tab.id) ? 'true' : 'false') : null"
      [attr.aria-pressed]="isTabs() ? null : isSelected(tab.id) ? 'true' : 'false'"
      [attr.aria-controls]="isTabs() ? (tab.panelId ?? null) : null"
      [disabled]="(tab.disabled ?? false) || disabled()"
      (click)="select(tab)"
    >
      <span class="tab__label">{{ tab.label }}</span>
      @if (isSelected(tab.id) && selectedLabel()) {
        <span class="tab__state">{{ selectedLabel() }}</span>
      }
    </button>
  }
</div>
