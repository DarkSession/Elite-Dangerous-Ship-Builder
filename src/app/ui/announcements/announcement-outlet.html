<div
  data-announcement-outlet="assertive"
  role="alert"
  aria-live="assertive"
  aria-atomic="true"
  [attr.aria-label]="assertiveLabel()"
>
  @for (spoken of assertive(); track spoken.identity) {
    {{ spoken.text }}
  }
</div>

<div
  data-announcement-outlet="polite"
  role="status"
  aria-live="polite"
  aria-atomic="true"
  [attr.aria-label]="politeLabel()"
>
  @for (spoken of polite(); track spoken.identity) {
    {{ spoken.text }}
  }
</div>
