<div class="pips" role="group" [attr.aria-label]="label()" [attr.data-bank]="bank()">
  @for (step of steps(); track step.id) {
    <button
      class="pips__step"
      type="button"
      [attr.aria-label]="step.label"
      (click)="stepRequested.emit(step.value)"
    >
      <span class="pips__fill" aria-hidden="true" [style.inline-size.%]="step.fill * 100"></span>
    </button>
  }
</div>
