<span class="identity">
  <!--
    The name and whatever marks it, on one line. Canvas 1c draws the route icon
    of a restricted module in the name's own row — `Advanced Plasma Accelerator`
    with the Powerplay mark 7px after it — and the code line below the two. A
    marker projected after the whole badge landed under the code line instead,
    which is a third line the canvas does not have.
  -->
  <span class="identity__line">
    <edsb-game-text
      class="identity__name"
      [class.identity__name--compact]="compact()"
      [text]="name().text"
      [language]="name().language"
      [translationState]="name().translationState"
    />
    <ng-content />
  </span>

  <!--
    One line, one ink, as canvas 1c writes it: `4A GIMBALLED · OVERCHARGED G5 ·
    CORROSIVE`. The class and rating are read out in words beside it rather than
    left as a code, and a package symbol is bidi-isolated so two different
    modules cannot look like one in a right-to-left reading.
  -->
  @if (codeLine(); as line) {
    <span class="identity__code-line" data-bidi-isolate>{{ line }}</span>
  }
  @if (codeDescription(); as description) {
    <span class="visually-hidden">{{ description }}</span>
  }
</span>
