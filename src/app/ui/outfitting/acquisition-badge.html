@if (rendered().length > 0) {
  <!--
    Deliberately unlabelled. An `aria-label` here would be the name of every
    restriction under it rather than a heading over them: an accessible name
    computed from content takes a descendant's label *in place of* that
    descendant's own text, so a ledger row inside a button announced
    "How this module is obtained" and never "Sold only to a pledged commander by
    their power." The icon is the only carrier a sighted Commander has, so the
    sentence is the only carrier anyone else has, and nothing may stand in front
    of it (constitution V).
  -->
  <ul class="acquisition">
    @for (label of rendered(); track label.kind + label.packageValue) {
      <li class="acquisition__item">
        <!--
          Both canvases draw exactly two markers on a restricted row: the icon
          of the route the article is earned through, and the Merc Coin icon
          beside the module's name. Every other restriction is real and is
          carried in the sentence, which is here whether or not it is drawn —
          the invisible floor, rather than a row of chips the reference does not
          have (design-canvas rule).

          `alt` is empty on all of them because the sentence beside them says
          the same thing in words: a marker and its own caption read as two
          restrictions where there is one.

          Each mark hangs its own short gloss on the design system's tooltip.
          Canvas 1c gives every one of these icons a tip on hover —
          `data-tip="Powerplay module"`, `"Community goal reward"`,
          `"Tech Broker unlock"`, `"Merc Coin purchase"` — and without one an
          icon on a row where the sentence is not drawn is a mark with no way
          to ask what it means. It is not hung on a `title`: a `title` cannot be
          reached by touch at all, and hover-only meaning is unreachable by
          touch (011 FR-006, Commander request 2026-08-27).

          The whole control is `aria-hidden`, and that is the same ruling as
          before rather than a new one. The row already carries its restriction
          as a sentence; a mark that also announced it would be one restriction
          said twice. Hidden from the tree — and taken out of the tab order by
          `presentational` — the tip is what it was meant to be: a way to *see*
          what a reader already has.
        -->
        @switch (label.marker) {
          @case ('communityGoal') {
            <ednb-tooltip
              class="acquisition__mark"
              aria-hidden="true"
              [presentational]="true"
              [tip]="label.tip ?? ''"
            >
              <img
                class="acquisition__route"
                src="assets/icons/community-goal.svg"
                alt=""
                width="14"
                height="14"
              />
            </ednb-tooltip>
          }
          @case ('powerplay') {
            <ednb-tooltip
              class="acquisition__mark"
              aria-hidden="true"
              [presentational]="true"
              [tip]="label.tip ?? ''"
            >
              <img
                class="acquisition__route"
                src="assets/icons/powerplay.svg"
                alt=""
                width="14"
                height="14"
              />
            </ednb-tooltip>
          }
          @case ('techBroker') {
            <ednb-tooltip
              class="acquisition__mark"
              aria-hidden="true"
              [presentational]="true"
              [tip]="label.tip ?? ''"
            >
              <img
                class="acquisition__route acquisition__route--broker"
                src="assets/icons/tech-broker.svg"
                alt=""
                width="14"
                height="14"
              />
            </ednb-tooltip>
          }
          @case ('mercCoin') {
            <ednb-tooltip
              class="acquisition__mark"
              aria-hidden="true"
              [presentational]="true"
              [tip]="label.tip ?? ''"
            >
              <img
                class="acquisition__coin"
                src="assets/icons/merc-coin.png"
                alt=""
                width="14"
                height="14"
              />
            </ednb-tooltip>
          }
        }
        <span [class.visually-hidden]="!showExplanations()" class="acquisition__explanation">
          {{ label.explanation }}
        </span>
      </li>
    }
  </ul>
}
