<div class="search">
  <ednb-text-field
    #field
    class="search__field"
    kind="search"
    [label]="label()"
    [labelHidden]="true"
    [placeholder]="placeholder()"
    [description]="instructions()"
    [descriptionHidden]="true"
    [value]="query()"
    (changed)="changed.emit($event)"
  />

  <!--
    One box at the field's trailing edge, holding whichever of the two belongs
    there. The `⌘K` is the canvas's, decorative for a reader: it names a
    convenience, and the field is already reachable and already named. A field
    with something in it has no use for an invitation to jump to it, and that is
    the moment the clear control needs the space — so they take turns rather
    than sharing a row.
  -->
  @if (canClear()) {
    <!--
      Discreet, and still a real control: the glyph is decoration and the button
      carries the sentence as its name, and its target is the full height of the
      field however small the mark inside it is drawn.
    -->
    <button
      class="search__clear"
      type="button"
      [attr.aria-label]="clearLabel()"
      (click)="cleared.emit()"
    >
      <span class="search__clear-mark" aria-hidden="true">✕</span>
    </button>
  } @else {
    <p class="search__shortcut" aria-hidden="true">{{ shortcutHint() }}</p>
  }
</div>

<!--
  The count is spoken, not drawn, at this level: canvas 1d draws it in the
  screen's own header bar and canvas 1c draws none, so the surface places the
  visible one and this stays the polite announcement of it.
-->
<p class="visually-hidden" role="status">{{ announcement() }}</p>
