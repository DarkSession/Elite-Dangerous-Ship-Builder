<!--
  Canvas 1c's cool-bordered dropdown, canvas 1d's card list. The package's own
  description rides in the option label, so the dropdown offers what the cards
  offer rather than a shorter version of it (constitution V).
-->
@if (asDropdown()) {
  <edsb-select-field
    class="effects__field"
    [label]="legend()"
    [options]="options()"
    [value]="selected() ?? noEffect"
    (changed)="chosen.emit($event === noEffect ? null : $event)"
  />
} @else {
  <fieldset class="effects">
    <legend class="effects__legend">{{ legend() }}</legend>

    <label class="effect effect--none" [attr.data-selected]="selected() === null">
      <input
        class="effect__radio"
        type="radio"
        [name]="groupName"
        [value]="noEffect"
        [checked]="selected() === null"
        (change)="chosen.emit(null)"
      />
      <span class="effect__identity">
        <span class="effect__name">{{ noneLabel() }}</span>
      </span>
    </label>

    @for (effect of effects(); track effect.fdname) {
      <label class="effect" [attr.data-selected]="selected() === effect.fdname">
        <input
          class="effect__radio"
          type="radio"
          [name]="groupName"
          [value]="effect.fdname"
          [checked]="selected() === effect.fdname"
          [attr.aria-label]="nameFor(effect)"
          (change)="chosen.emit(effect.fdname)"
        />
        <span class="effect__identity">
          <edsb-game-text
            class="effect__name"
            [text]="effect.name.text"
            [language]="effect.name.language"
            [translationState]="effect.name.translationState"
          />
          <!--
            Only where the package has one. `edsb-game-text` stands in for a
            missing string with `Name unavailable`, which is the right answer for
            a name — an article a reader cannot be told the name of is a fact
            worth stating — and the wrong one here twice over: this is not a
            name, and an effect whose description the catalogue does not carry is
            already fully named on the line above. The Almanac carries no
            description for any of them today, so every option in the card read
            `Name unavailable` under its own name (Commander request
            2026-08-26).
          -->
          @if (effect.description.text !== null) {
            <edsb-game-text
              class="effect__description"
              [text]="effect.description.text"
              [language]="effect.description.language"
              [translationState]="effect.description.translationState"
            />
          }
          @if (effect.applied) {
            <span class="effect__applied">{{ appliedLabel() }}</span>
          }
        </span>
      </label>
    }
  </fieldset>
}
