@if (resolved().length > 0) {
  <section class="notice" [attr.aria-label]="regionLabel()">
    <div class="notice__header">
      <h3 class="notice__title">{{ title() }}</h3>
    </div>

    <ul class="notice__lines">
      @for (line of resolved(); track line.id) {
        <li class="notice__line">
          <ednb-status-notice [tone]="tone()" [message]="line.text" [detail]="line.detail" />
        </li>
      }
    </ul>
  </section>
}
