<div
  class="catalogue"
  [class.catalogue--detail-open]="detailOpen() || detailWaiting() || detailFailed()"
>
  <div class="catalogue__manifest-region">
    <!--
      Everything that is browsing rather than heading. At narrow widths with a
      hull open, this steps aside so the detail has the screen — while the page
      keeps exactly one h1 and one heading order, whichever composition is
      showing.
    -->
    <div class="catalogue__browse">
      <ednb-collection-toolbar
        [search]="search()"
        [sizeChoices]="sizeChoices()"
        [selectedSizes]="selectedSizes()"
        [sortOptions]="sortOptions()"
        [sort]="sort()"
        (searchChanged)="changeSearch($event)"
        (sizesChanged)="changeSizes($event)"
        (sortFieldChanged)="changeSort($event)"
      />

      <ednb-responsive-catalogue-view
        [caption]="caption()"
        [columns]="columns()"
        [hulls]="hulls()"
        [emptyLabel]="emptyDescription()"
        [restsToRead]="restsToRead()"
        (sortRequested)="changeSort($event)"
        (hullOpened)="openHull($event)"
        (hullPreviewed)="previewHull($event)"
        (hullBuilt)="buildHull($event)"
      />
    </div>
  </div>

  <!-- The hull-detail child route: an inspector here, a full-screen layer at
       narrow widths. Same address either way.

       A group with a tab stop, not a bare overflow box. At the wide composition
       the rail is a scroll box of its own — a hull taller than the space under
       the command bar scrolls inside it — and the rail holds no control at that
       width, because the manifest beside it is the build (FR-007). A scroll box
       nothing inside can be reached by is content a keyboard cannot get to, so
       the box itself takes the stop, the same way `ednb-data-table` does
       (009 ruling F).

       Declared once rather than per composition, as `outfitting__status-rail`
       declares its own: below the wide step the box does not scroll and the
       stop is one extra tab on a region that is already the whole screen, which
       is cheaper than a stop that appears and disappears with the width. The
       region is not drawn until a hull is open, or on its way, so an empty group
       is never focusable. -->
  <div class="catalogue__inspector" tabindex="0" role="group" [attr.aria-label]="inspectorLabel()">
    <!--
      The first hull opened from the manifest is a chunk of its own, and the rail
      beside the list is drawn before it lands. The skeleton holds the hull's
      place, so the rail is never a named group with nothing in it (011/FR-029).

      A hull opened straight at its own address is the page's case rather than
      this one: the router resolves this screen and the hull's together, so this
      screen does not exist yet to draw anything, and the frame's own skeleton
      stands over the whole page.
    -->
    @if (detailWaiting()) {
      <ednb-skeleton [label]="detailLoadingLabel()" [lines]="5" />
    } @else if (detailFailed()) {
      <!--
        The chunk did not arrive. Without a word here the rail would draw a
        skeleton, take it down, and leave a Commander back on the manifest with
        nothing said about the hull they asked for.
      -->
      <ednb-status-notice tone="error" [message]="detailFailedLabel()" />
    }

    <router-outlet />
  </div>
</div>
