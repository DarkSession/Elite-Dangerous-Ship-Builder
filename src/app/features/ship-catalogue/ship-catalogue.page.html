<div class="catalogue" [class.catalogue--detail-open]="detailOpen()">
  <div class="catalogue__manifest-region">
    <h1>{{ heading() }}</h1>

    <!--
      Everything that is browsing rather than heading. At narrow widths with a
      hull open, this steps aside so the detail has the screen — while the page
      keeps exactly one h1 and one heading order, whichever composition is
      showing.
    -->
    <div class="catalogue__browse">
      <div class="catalogue__header">
        <p class="catalogue__description">{{ description() }}</p>
        <p class="catalogue__total">{{ totalText() }}</p>
      </div>

      <edsb-collection-toolbar
        [search]="search()"
        [sizeChoices]="sizeChoices()"
        [selectedSizes]="selectedSizes()"
        [manufacturerOptions]="manufacturerOptions()"
        [selectedManufacturer]="selectedManufacturer()"
        [hardpointOptions]="hardpointOptions()"
        [selectedHardpointClass]="selectedHardpointClass()"
        [priceMin]="priceMin()"
        [priceMax]="priceMax()"
        [sortOptions]="sortOptions()"
        [sort]="sort()"
        [constraints]="constraints()"
        [countText]="countText()"
        (searchChanged)="changeSearch($event)"
        (sizesChanged)="changeSizes($event)"
        (manufacturerChanged)="changeManufacturer($event)"
        (hardpointClassChanged)="changeHardpointClass($event)"
        (priceMinChanged)="changePriceMin($event)"
        (priceMaxChanged)="changePriceMax($event)"
        (sortFieldChanged)="selectSortField($event)"
        (sortDirectionToggled)="toggleSortDirection()"
        (constraintRemoved)="removeConstraint($event)"
        (cleared)="clearConstraints()"
      />

      @if (hasUnavailableFacts()) {
        <edsb-status-notice tone="info" [message]="unavailableFactsNotice()" />
      }

      @if (isEmpty()) {
        <div class="catalogue__empty">
          <h2>{{ emptyTitle() }}</h2>
          <p>{{ emptyDescription() }}</p>
        </div>
      }

      <edsb-responsive-catalogue-view
        [caption]="caption()"
        [columns]="columns()"
        [hulls]="hulls()"
        [openLabel]="openLabel()"
        (sortRequested)="changeSort($event)"
        (hullOpened)="openHull($event)"
      />
    </div>
  </div>

  <!-- The hull-detail child route: an inspector here, a full-screen layer at
       narrow widths. Same address either way. -->
  <div class="catalogue__inspector">
    <router-outlet />
  </div>
</div>
