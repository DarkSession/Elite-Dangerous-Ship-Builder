<!--
  Canvas 1c draws the workspace as the command bar and then the regions: the
  build's name and hull are the bar's identity block, the history controls with
  `EXPORT` and a filled `SAVE` are its actions, and nothing stands between the
  bar and the ledger. A hull line, a provenance line, a saved-state line and a "this build
  is valid" banner were none of them drawn — the canvas reports problems and
  says nothing when there are none (design-canvas rule).
-->
@if (linkFailure(); as failure) {
  <ednb-status-notice tone="error" [message]="failure.message" [detail]="failure.detail" />
}

@if (hasBuild()) {
  <ednb-persistence-status />

  @if (validationProblem(); as verdict) {
    <ednb-status-notice [tone]="verdict.tone" [message]="verdict.message" />
  }

  <!--
    Where the module editors and statistics of later capabilities mount. The
    workspace owns the build; they compose into it.

    Feature 002's outfitting region is the first of them. It reads the same one
    active build this page owns and never holds a second, so the validation
    verdict above and the ledger below cannot disagree about what is fitted.
  -->
  <div class="workspace__outlet">
    <ednb-outfitting-workspace />
  </div>
} @else if (readingLink()) {
  <!--
    A page opened at an address that carries a build link, with the codec still
    on its way. There may well be a build; saying there is none is the one thing
    this screen must not do while it is finding out (011/FR-029).
  -->
  <ednb-skeleton [label]="readingLabel()" [lines]="4" />
} @else {
  <ednb-empty-state [title]="emptyTitle()" [description]="emptyDescription()">
    <ednb-action-link
      [label]="emptyAction()"
      [href]="catalogueRoute"
      [routerLink]="catalogueRoute"
    />
  </ednb-empty-state>
}

<!--
  Canvas 1c's `SAVE BUILD`, opened from the command bar's filled action. It is
  this screen's rather than the library's since 2026-08-27: a library answers
  "which of these builds", and what should become of one is asked where a
  Commander is working in it (FR-009).
-->
<ednb-save-build-dialog
  [open]="saveOpen()"
  [initialName]="saveInitialName()"
  [initialNote]="saveInitialNote()"
  [source]="saveSource()"
  [duplicateCount]="saveDuplicateCount()"
  [failure]="saveFailure()"
  [saving]="saving()"
  (nameChanged)="changeSaveName($event)"
  (saveRequested)="requestSave($event)"
  (dismissed)="dismissSave()"
/>

<!--
  The save's own conflict: another page wrote the record after this one opened
  it. Three answers, each stating which versions survive, and no lock is held
  while it is on screen (FR-012).
-->
<ednb-choice-dialog
  [open]="conflict() !== null"
  [title]="conflictTitle()"
  [description]="conflictDescription()"
  [choices]="conflictChoices()"
  [dismissLabel]="dismissLabel()"
  (chosen)="resolveConflict($event)"
  (dismissed)="dismissConflict()"
/>
