<!-- The command bar carries this screen's name; the page does not repeat it. -->
@if (linkFailure(); as failure) {
  <edsb-status-notice tone="error" [message]="failure.message" [detail]="failure.detail" />
}

@if (hasBuild()) {
  <dl class="workspace__summary">
    <dt>{{ hullLabel() }}</dt>
    <dd>
      @if (hull(); as name) {
        <edsb-game-text
          [text]="name.text"
          [language]="name.language"
          [translationState]="name.translationState"
        />
      }
    </dd>

    @if (provenance(); as source) {
      <dt>{{ provenanceLabel() }}</dt>
      <dd>{{ source }}</dd>
    }
  </dl>

  <p class="workspace__saved-state">{{ savedState() }}</p>

  <edsb-persistence-status />

  @if (validation(); as verdict) {
    <edsb-status-notice [tone]="verdict.tone" [message]="verdict.message" />
  }

  <div class="workspace__actions">
    <edsb-action-button [label]="shareLabel()" (activated)="exportOpen.set(true)" />
  </div>

  <!--
    Where the module editors and statistics of later capabilities mount. The
    workspace owns the build; they compose into it.

    Feature 002's outfitting region is the first of them. It reads the same one
    active build this page owns and never holds a second, so the validation
    verdict above and the ledger below cannot disagree about what is fitted.
  -->
  <div class="workspace__outlet">
    <edsb-outfitting-workspace />
  </div>
} @else {
  <div class="workspace__empty">
    <h2>{{ emptyTitle() }}</h2>
    <p>{{ emptyDescription() }}</p>
    <edsb-action-link
      [label]="emptyAction()"
      [href]="catalogueRoute"
      [routerLink]="catalogueRoute"
    />
  </div>
}

<edsb-export-dialog [open]="exportOpen()" (dismissed)="exportOpen.set(false)" />
