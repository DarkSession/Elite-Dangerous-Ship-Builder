<!--
  Canvas 1c's `SHOT CONVERGENCE` block: the gunsight plate, the same diagram in
  words, and the range the plate is drawn at.

  Re-drawn for the 2026-08-26 revision, which took three things out and put one
  in. Out went the ring caption and the four cells beneath the plate — the two
  spans, the widest mount and the apparent spread — which the canvas no longer
  draws anywhere. In came the boresight: the ring and centre dot that mark
  where the ship itself is pointing, so a Commander reads convergence against
  the axis rather than against the middle of a box.
-->
<div class="convergence">
  <!--
    The gunsight plate. Decorative in full: every shot on it is stated in
    words in the list below, which is what actually reports the spread. A
    shot outside the plate's field of view is held at the frame's own
    margin and keeps the sentence that states where it really goes.
  -->
  <div class="plate" aria-hidden="true">
    <span class="plate__axis plate__axis--vertical"></span>
    <span class="plate__axis plate__axis--horizontal"></span>

    <!--
      The boresight the 2026-08-26 revision adds: a hairline ring on the axis
      with a filled dot at its centre. It is where the hull points, so it is
      what every shot is offset *from* — the one mark on this plate that is a
      property of the drawing rather than of the build, which is why it takes
      no state and needs no sentence of its own.
    -->
    <span class="plate__boresight"></span>
    <span class="plate__boresight-centre"></span>

    <!--
      The two dashed rings. Each is a circle in *angle*, and on a box that is
      square that makes it a circle in pixels too: the canvas corrects a ring's
      height by the box's own `offsetWidth / offsetHeight`, which here is one.
      `aspect-ratio` is that correction, without measuring anything.
    -->
    @for (ring of rings(); track ring.milliradians) {
      <span class="plate__ring" [style.width.%]="ring.width * 100"></span>
    }

    <!--
      Every one of the hull's hardpoints twice, as the 2026-08-25 canvas
      draws an armed one: the dot where the shot lands, and the mount's
      hardpoint numeral set beside it, at whichever of four corners stands
      clear of the other dots. The badge column parked at the plate's edge,
      and the leader lines back from it, are gone with the revision.

      An empty hardpoint is drawn too, in the quiet ink the schematics
      already give an empty mount: where a mount sits is a property of the
      hull rather than of what is on it, and a Commander deciding what to
      fit is asking exactly where a shot from that mount would go. The
      selected mount takes the plate's other ink and a ring in the same
      one, while whether it is armed stays with the fill against the
      outline, so a selected empty hardpoint is still visibly empty.
      Both distinctions are written out in the list below, and so is the
      one the plate no longer draws at all: how each weapon aims.

      Nothing is clipped any more either: a shot far enough off-axis is
      held at the frame's own margin, because the field of view is a
      property of the drawing and never widens to fit a build. That is
      exactly the case where the sentence beside the plate is the true
      reading, and it states the offset and angle the shot really has
      (FR-011).
    -->
    <!--
      A leader for every numeral that had to leave its dot's four corners. Drawn
      under the marks and over the ground, in the plate's own percentage
      coordinates, so the line and the numeral can never disagree about where
      they meet.
    -->
    <svg class="plate__leaders" viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
      @for (shot of shots(); track shot.id) {
        @if (shot.leader; as leader) {
          <line
            class="plate__leader"
            [attr.x1]="leader.x1"
            [attr.y1]="leader.y1"
            [attr.x2]="leader.x2"
            [attr.y2]="leader.y2"
            vector-effect="non-scaling-stroke"
          />
        }
      }
    </svg>

    @for (shot of shots(); track shot.id) {
      <span
        class="plate__dot"
        [class.plate__dot--empty]="!shot.armed"
        [class.plate__dot--selected]="shot.selected"
        [style.left.%]="shot.left"
        [style.top.%]="shot.top"
      ></span>
      <span
        class="plate__numeral"
        [class.plate__numeral--empty]="!shot.armed"
        [class.plate__numeral--selected]="shot.selected"
        [style.left.%]="shot.left"
        [style.top.%]="shot.top"
        [style.margin-left.px]="shot.numeralLeft"
        [style.margin-top.px]="shot.numeralTop"
        >{{ shot.badge }}</span
      >
    }
  </div>

  <!--
    The same diagram in words. This is the reading; the plate above is the
    picture of it, and every mark on it is restated here — the empty
    hardpoints and the selected mount with the rest, because those are two
    of the three things the plate's inks separate. Each sentence carries the
    offset and the angle that mount's shot really has, so a numeral moved
    aside to keep the plate legible changes nothing that is read.
  -->
  <ul class="shots" [attr.aria-label]="plateLabel()">
    @for (shot of shots(); track shot.id) {
      <li class="shots__entry">{{ shot.statement }}</li>
    }
  </ul>

  <!--
    The range, in a column beside the plate — the canvas's own arrangement,
    which falls beneath the plate when there is no room to stand there. The
    2026-08-26 revision leaves the range alone in this column.
  -->
  <div class="convergence__readout">
    <edsb-range-field
      class="convergence__range"
      [label]="rangeLabel()"
      [min]="rangeBounds.min"
      [max]="rangeBounds.max"
      [step]="rangeBounds.step"
      [value]="targetRange()"
      [valueText]="targetRangeText()"
      [minText]="rangeMinText()"
      [maxText]="rangeMaxText()"
      (changed)="setTargetRange($event)"
    />
  </div>
</div>
