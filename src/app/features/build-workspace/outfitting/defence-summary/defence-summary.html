@if (shown()) {
  <!--
    Two of the rail's cells, in the one grid the canvas draws its band on.
    The group runs in flow so its cells become items of that grid rather than of
    a second one nested inside it: the canvas rules the cells off each other with
    one hairline ground, and grids stacked would rule blocks off each
    other instead (`design/status-rail.md`, "The metric cells").
  -->
  <ednb-metric-group [flow]="true" [label]="railLabel()" [metrics]="cells()" />
}
