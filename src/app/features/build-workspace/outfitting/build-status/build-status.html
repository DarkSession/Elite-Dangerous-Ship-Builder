<!--
  The package's verdict, either way. A build the package calls valid carries one
  line saying so, in the same block and the same voice as the issues below:
  silence there read as a rail that had not loaded rather than as an all-clear
  (Commander request 2026-08-27, revising FR-015). Nothing is drawn at all until
  there is a build to have a verdict about. The two blocks are not exclusive —
  a `warning` leaves a build valid, so the verdict stands above its own amber
  block.
-->
@if (valid()) {
  <p class="issue issue--valid">{{ validLabel() }}</p>
}

@if (issues().length > 0) {
  <ul class="issues">
    @for (issue of issues(); track issue.id) {
      <li class="issue" [class]="'issue issue--' + issue.severity">
        <!--
          The severity in words. Hidden, because neither canvas draws it: the
          reference carries the tier in the marker and its ground, and a word
          the design does not draw does not go on the screen. It stays as the
          accessibility floor — read aloud beside the sentence, costing the
          design nothing — and it is what carries the severity, because tiers
          one and two differ from each other in hue alone (FR-022, and the
          design-canvas rule for what may exist unseen).
        -->
        <span class="visually-hidden">{{ issue.severityLabel }}</span>

        <edsb-game-text
          class="issue__diagnostic"
          [text]="issue.diagnostic.text"
          [language]="issue.diagnostic.language"
          [translationState]="issue.diagnostic.translationState"
        />
      </li>
    }
  </ul>
}
