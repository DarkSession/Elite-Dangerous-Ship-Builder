<!--
  No wrapper and no inset of its own. Canvas 1c draws this block and the metric
  cells under it inside one padded block, and the workspace owns that block
  (`.outfitting__status-band`) because four other features draw into it too — so
  the host element is this block, and a box of its own inside it would only stand
  these figures a padding further in than the cells they head.
-->
@if (shown()) {
  <!--
    Canvas 1c's `POWER` block: the label, the figures, and the bar of the same
    figures again — what is lit, what is not, and where the plant runs out.
  -->
  <p class="rail-power">
    <span class="rail-power__label" [id]="powerLabelId">{{ powerLabel() }}</span>
    <span class="rail-power__figures" data-bidi-isolate>{{ figures() }}</span>
  </p>

  @if (bar(); as bar) {
    <!--
      The bar carries no reading of its own: it is the line above it drawn out.
      It is labelled all the same, because a bar with no name is a shape a
      reader is left to guess at.
    -->
    <span class="rail-bar" role="img" [attr.aria-label]="bar.label">
      <span
        class="rail-bar__powered"
        aria-hidden="true"
        [style.inline-size.%]="bar.powered * 100"
      ></span>
      <span
        class="rail-bar__unpowered"
        aria-hidden="true"
        [style.inset-inline-start.%]="bar.powered * 100"
        [style.inline-size.%]="bar.unpowered * 100"
      ></span>
      <span
        class="rail-bar__plant"
        aria-hidden="true"
        [style.inset-inline-start.%]="bar.plant * 100"
      ></span>
    </span>
  }

  <!--
    Canvas 1c's three `.pipset` groups under the bar, and the control they are:
    pressing a block asks for that many pips in that bank, and the six there are
    between the three move the other two to pay for it. It is the same single
    condition the distributor table's cell edits — one allocation in two places,
    with no draft, no running total and no confirmation step.
  -->
  @if (pipSets().length > 0) {
    <div class="pipsets" role="group" [attr.aria-label]="pipsLabel()">
      @for (set of pipSets(); track set.kind) {
        <div class="pipset" [attr.data-bank]="set.kind">
          <span class="pipset__name" aria-hidden="true">{{ set.name }}</span>

          <!--
            The group is named with the allocation it stands at, so the reading
            is there for anyone who cannot see the blocks. That name is why the
            bank's own name above may be hidden: it is inside this one already,
            and announced twice it is noise.
          -->
          <ednb-pip-control
            [bank]="set.kind"
            [label]="set.label"
            [steps]="set.steps"
            (stepRequested)="setPips(set.kind, $event)"
          />
        </div>
      }
    </div>
  }
}
