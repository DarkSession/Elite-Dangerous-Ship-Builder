<edsb-layer
  [open]="open()"
  [title]="title()"
  [dismissLabel]="dismissLabel()"
  presentation="adaptive"
  (dismissed)="dismissed.emit()"
>
  <div class="save">
    <edsb-text-field
      [label]="nameLabel()"
      [value]="name()"
      [required]="true"
      (changed)="changeName($event)"
    />

    <!--
      One local note, saved with the build rather than by a control of its own.
      It never enters a build link or a SLEF export, and typing one is not an
      edit to the build (FR-011).
    -->
    <edsb-textarea-field
      [label]="noteLabel()"
      [value]="note()"
      [rows]="3"
      (changed)="changeNote($event)"
    />

    <!--
      The canvas's two bordered cards: each led by a square marker, filled on
      the one that is chosen, the chosen plate washed amber, and the outcome
      stated in associated words beneath the title.

      Drawn only where both apply. A build with nothing to replace has one thing
      `SAVE BUILD` can do, and a single selected card in front of it is a
      question with one answer.

      The legend is read but not drawn: the canvas puts the two cards straight
      under the note field with no heading over them, and a group of radios a
      reader arrives at unannounced is the one thing that arrangement would cost
      (WCAG 1.3.1).
    -->
    @if (modes().length > 0) {
      <edsb-choice-group
        class="save__modes"
        [legend]="modeLegend()"
        [legendHidden]="true"
        kind="radio"
        layout="marked-cards"
        [choices]="modes()"
        [selected]="selectedMode()"
        (changed)="changeMode($event)"
      />
    }

    <div class="save__footer">
      <!--
        The canvas's monospace message line. `status` rather than `alert`: it
        reports what a name a Commander is still typing would do, and an
        assertive interruption on every keystroke would be worse than silence.
      -->
      <p class="save__message" [class.save__message--failure]="failure() !== null" role="status">
        @if (message(); as sentence) {
          {{ sentence }}
        }
      </p>

      <div class="save__actions">
        <edsb-action-button
          [label]="cancelLabel()"
          emphasis="secondary"
          (activated)="dismissed.emit()"
        />
        <!--
          The message line is not wired to this button as a description: it is a
          `status` region, so it is announced when it changes, and a description
          repeated on every focus of the button would say the same sentence
          twice.
        -->
        <edsb-action-button
          [label]="confirmLabel()"
          emphasis="primary"
          [disabled]="!canSave() || saving()"
          (activated)="save()"
        />
      </div>
    </div>
  </div>
</edsb-layer>
