<edsb-layer
  [open]="open()"
  [title]="title()"
  [dismissLabel]="dismissLabel()"
  presentation="adaptive"
  (dismissed)="dismissed.emit()"
>
  <div class="save">
    <edsb-text-field
      [label]="nameLabel()"
      [value]="currentName()"
      [description]="nameDescription()"
      (changed)="changeName($event)"
    />

    @if (duplicateWarning(); as warning) {
      <edsb-status-notice tone="warning" [message]="warning" />
    }

    @if (overwriteUnavailable(); as reason) {
      <edsb-status-notice tone="warning" [message]="reason" />
    }

    <!--
      Each commitment says what it does to the stored builds. Only where there
      is a choice to make: with nothing to replace, the single action stores
      this build and removes nothing, which the dialog's own title already says.
    -->
    <div class="save__actions">
      @if (canOverwrite()) {
        <div class="save__choice">
          <edsb-action-button
            [label]="overwriteLabel()"
            emphasis="primary"
            [disabled]="!canSave()"
            [attr.aria-describedby]="overwriteOutcomeId"
            (activated)="save(true)"
          />
          <p class="save__outcome" [id]="overwriteOutcomeId">{{ overwriteOutcome() }}</p>
        </div>
      }
      <div class="save__choice">
        <edsb-action-button
          [label]="asNewLabel()"
          [emphasis]="canOverwrite() ? 'secondary' : 'primary'"
          [disabled]="!canSave()"
          [attr.aria-describedby]="canOverwrite() ? asNewOutcomeId : null"
          (activated)="save(false)"
        />
        @if (canOverwrite()) {
          <p class="save__outcome" [id]="asNewOutcomeId">{{ asNewOutcome() }}</p>
        }
      </div>
    </div>
  </div>
</edsb-layer>
