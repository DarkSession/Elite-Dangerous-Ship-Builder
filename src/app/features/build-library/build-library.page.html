<!--
  The reference draws the saved builds as a surface rather than a page: a
  centred dialog over an inert originating screen where there is room, the same
  content as a full-screen layer where there is not (canvas 1a "SAVED BUILDS",
  canvas 1b `ssv-screen`). It has no address of its own. Opening it takes a
  history entry at the address already showing, so the browser's own back closes
  it as well as its own dismiss (`library-presence.ts`).
-->
<ednb-layer
  [open]="true"
  [title]="listLabel()"
  [dismissLabel]="dismissLabel()"
  presentation="adaptive"
  width="widest"
  [flush]="true"
  (dismissed)="close()"
>
  <section class="library">
    @if (storageNotice(); as notice) {
      <ednb-status-notice class="library__notice" tone="error" [message]="notice" />
    }

    @if (failure(); as reason) {
      <ednb-status-notice class="library__notice" tone="error" [message]="reason" />
    }

    <!--
      The header row: one search field over the records, and the count in
      monospace beside it on the same line, where the reference puts them.

      The field carries its words in the placeholder and draws no label above
      them, as the canvas does. The label is still a real one, bound to the
      control and read aloud — a placeholder disappears as soon as somebody
      types, so it cannot be the only name the field has.
    -->
    <div class="library__header">
      <ednb-text-field
        class="library__search"
        [label]="searchLabel()"
        [labelHidden]="true"
        [placeholder]="searchLabel()"
        [value]="search()"
        kind="search"
        (changed)="changeSearch($event)"
      />
      <p class="library__count">{{ countText() }}</p>
    </div>

    @if (isEmpty()) {
      <ednb-empty-state [title]="emptyTitle()" [description]="emptyDescription()" />
    } @else {
      <ednb-responsive-record-list
        [label]="listLabel()"
        [columns]="columns()"
        [builds]="builds()"
        [chosen]="chosen()"
        [unavailable]="unavailable()"
        [unavailableLabel]="unavailableLabel()"
        [noMatch]="noMatch() ? noMatchText() : null"
        (chose)="chooseRecord($event)"
      />
    }

    @if (manageReason(); as reason) {
      <ednb-record-manager
        class="library__manager"
        [records]="manageableRecords()"
        [selected]="selectedForDiscard()"
        [reason]="reason"
        (selectionChanged)="changeDiscardSelection($event)"
        (discardRequested)="discardSelected($event)"
      />
    }
  </section>

  <!-- The committing footer both canvases draw: the destructive action bordered
       warm on the leading edge, the opening action filled amber on the
       trailing edge, pinned where the surface is compact. Two actions, which is
       what the canvas draws — naming, renaming and saving a copy are the
       workspace's own SAVE since 2026-08-27 (FR-009). -->
  <div class="library__footer">
    @if (chosenActions().length === 0) {
      <p class="library__footer-hint">{{ nothingChosen() }}</p>
    } @else {
      @for (action of chosenActions(); track action.id) {
        <ednb-action-button
          class="library__footer-action library__footer-action--{{ action.id }}"
          [label]="action.label"
          [emphasis]="action.emphasis"
          (activated)="commit(action.id)"
        />
      }
    }
  </div>
</ednb-layer>

<ednb-confirm-dialog
  [open]="pendingDelete() !== null"
  [title]="deleteTitle()"
  [description]="deleteDescription()"
  [confirmLabel]="deleteConfirmLabel()"
  [cancelLabel]="deleteCancelLabel()"
  [dismissLabel]="dismissLabel()"
  [destructive]="true"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
/>
