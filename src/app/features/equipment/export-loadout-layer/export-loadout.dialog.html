<ednb-layer
  [title]="title()"
  [open]="open()"
  [dismissLabel]="dismissLabel()"
  width="wide"
  [flush]="true"
  (dismissed)="dismissed.emit()"
>
  <!--
    Canvas 1a: the format list on the leading edge, the chosen format's content
    beside it, one amber hairline between them running the height of the panel.
    The list carries no question above it, as it is drawn; the words stay for
    anyone reading the group aloud.
  -->
  <div class="export-loadout">
    <ednb-choice-group
      class="export-loadout__formats"
      layout="cards"
      [legend]="formatLegend()"
      [legendHidden]="true"
      [choices]="formats()"
      [selected]="selectedFormats()"
      (changed)="selectFormat($event)"
    />

    <div class="export-loadout__content">
      @if (share.format() === 'link') {
        <ednb-share-link-panel
          [state]="share.state()"
          [url]="share.url()"
          [refusal]="share.refusal()"
          [feedback]="share.feedback()"
          [shareAvailable]="share.shareAvailable"
          (copyRequested)="share.copy()"
          (shareRequested)="share.share()"
          (retryRequested)="share.retry()"
        />
      } @else {
        <!-- Twelve rows, which is what `--ednb-layout-export-content` keeps room
             for and what the ship tool's own export layer asks of the same
             field. At fourteen the payload stood 19px past that floor, so the
             layer was two heights: one for the two payload formats and a
             shorter one for the link, and choosing between them moved the panel
             under the hand that chose (Commander request 2026-09-04). -->
        <ednb-textarea-field
          class="export-loadout__payload"
          [label]="fieldLabel()"
          [value]="share.payload()"
          [readonly]="true"
          [technical]="true"
          [rows]="12"
        />

        <!-- The canvas's own pair, in its own order: the file first, the
             clipboard emphasised beside it, with `#ge-exp-meta` across from
             them on the leading edge. -->
        <div class="export-loadout__actions">
          @if (share.meta(); as meta) {
            <p class="export-loadout__meta" data-bidi-isolate>{{ meta }}</p>
          }

          <ednb-action-button [label]="downloadLabel()" (activated)="share.download()" />
          <ednb-action-button [label]="copyLabel()" emphasis="primary" (activated)="share.copy()" />
        </div>
      }
    </div>
  </div>
</ednb-layer>
