schema: spec-driven

context: |
  Nav Beacon is a client-side-only Angular application carrying tools for Elite
  Dangerous. Ship Builder plans ship loadouts; the Equipment Builder plans
  on-foot loadouts.

  Read `CONSTITUTION.md` before you plan anything. It is the project's
  non-negotiable law, it governs every specification and change, and the
  summary below does not replace it. Read `AGENTS.md` for how to work in the
  repository, and the specification of any capability you are about to touch.

  The nine principles, in brief:

  I.    Client-side only. No backend, no accounts, no telemetry, no request to
        any other origin. A build lives in memory, in `localStorage`, or in the
        URL fragment — never in a path or a query. Output is static files.
  II.   `@elite-dangerous-almanac/core` is the source of truth for game data and
        build calculations. Never hand-maintain game data, never reimplement a
        calculation the package provides, and never correct a library result
        here. A library defect is fixed in the library, and the blocked work
        waits for the release.
  III.  Domain logic lives outside components, in framework-agnostic services
        and signal-based stores that are testable without rendering.
  IV.   Lossless, honest builds. Never fabricate a value. Where the package
        reports something unavailable, invalid or incomplete, say so.
  V.    Desktop, tablet and mobile are all first-class, by touch as well as
        pointer, in both orientations, with no horizontal page scrolling.
        WCAG 2.2 AA, less eight excluded success criteria: 2.1.1, 2.1.2, 2.1.4,
        2.2.1, 2.4.1, 2.4.3, 2.4.7 and 2.4.11. Name all eight wherever
        conformance is stated; an unqualified AA claim is a stronger claim than
        this project supports. 2.2.1 is narrower than the other seven: it is
        excluded for applying a published update and for nothing else, and that
        is the application's only mechanism with a time limit. Introducing a
        second one amends the constitution.
  VI.   Nothing ships untranslatable. Every string the application owns goes
        through the localisation layer, and figures are formatted for the active
        locale. Game text belongs to the Almanac package.
  VII.  One design system, one dark theme. Design tokens are the only source of
        colour, type, spacing, radius, elevation and motion.
  VIII. Tests gate the build. Unit coverage at or above 80%. Playwright covers
        ten projects — five layout profiles in Chromium and in Firefox — with an
        accessibility scan over every screen. Never skip, quarantine or delete a
        test to get a build green, and never lower the threshold.
  IX.   Specification before implementation. Behaviour is agreed in writing
        first, and a capability specification is its standing record.

  Working rules:

  - Package manager is pnpm. A release must be published for seven days before
    an install may resolve it (`minimumReleaseAge` in `pnpm-workspace.yaml`).
    `minimumReleaseAgeExclude` in the same file lists what is exempt:
    `@elite-dangerous-almanac/*` outright, and a named security fix by version.
  - `pnpm run check` must pass before a change is proposed for merge.
  - Unit tests sit beside their source in `src/`; end-to-end tests in `e2e/`.
    A new journey needs both.
  - Nothing the application asks for at runtime may be a root-absolute path. A
    pull request is served from a sub-path, so a leading `/` misses the file.
  - `openspec/changes/archive/<NNN>-<short-name>/` holds the design and contract
    documents of the features already built. Code and specifications cite them
    by path. Read them; do not extend them.

  Language: plain, common words. Active voice, present tense, one idea per
  sentence. Simplified Technical English (ASD-STE-100) for anything addressed to
  the operator. No metaphor, no marketing adjectives, no emoji, and no changelog
  residue — documentation describes the current state, not the change that
  produced it. British spelling.

rules:
  spec:
    - Specify a capability, never a screen. A requirement names no component and
      pins no layout.
    - State where a value comes from. If it is game data or a build
      calculation, the requirement names the `@elite-dangerous-almanac/core`
      call that produces it.
    - Where a value can be unavailable, say what the Commander is told. Never
      permit a substituted zero, estimate or catalogue figure.
  design:
    - Record the screens the change introduces — what each composes from the
      design system, the states it handles, and the requirements it satisfies.
      This comes before the task breakdown.
  tasks:
    - Every task states how it is verified — a test, a command, or an
      observable behaviour.
    - Responsiveness, touch, accessibility, localisation and composition from
      the design system are in scope from the first task, never a later pass.
