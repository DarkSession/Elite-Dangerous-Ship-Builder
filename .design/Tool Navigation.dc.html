              act:['REPLOT','EXPORT'], lhd:'JUMPS', rhd:'ROUTE SUMMARY',
              stats:[['JUMPS','22',1],['DISTANCE','22,000 ly',0],['NEUTRON BOOSTS','14',0],['EST. TIME','1 h 40 m',0]],
              rows:[['01','Sol','SCOOPABLE · G','0 ly'],['07','Skaudai CH-B','NEUTRON · BOOST 4×','8,240 ly'],['13','Rohini','SCOOPABLE · K','13,110 ly'],['22','Colonia','ARRIVAL','22,000 ly']],
              side:[['SHIP','FEDERAL CORVETTE'],['JUMP RANGE','18.4 ly'],['FUEL SCOOP','6A'],['WARZONES AVOIDED','3'],['REFUELS','5']],
              carry:'Jump range comes from the live ship build, so re-outfitting replots the route without leaving the tool.' },
            { id:'market', ab:'MK', n:'Market Finder', grp:'TRADE', tab:'MARKET', pin:0, k:'',
              d:'Commodity prices, demand and station services.',
              crumb:'TRITIUM · 40 LY RADIUS', sub:['BUY','SELL','SERVICES','HISTORY'],
              act:['REFRESH'], lhd:'BEST PRICES', rhd:'MARKET SUMMARY',
              stats:[['BEST BUY','48,120 CR',0],['BEST SELL','61,940 CR',1],['SPREAD','13,820 CR',0],['UPDATED','21 M AGO',0]],
              rows:[['LH','Lave · Hutton','SELL · DEMAND 24K','61,940 CR'],['SO','Sol · Galileo','BUY · SUPPLY 8K','48,120 CR'],['AC','Achenar · Dawes','SELL · DEMAND 11K','59,410 CR'],['SH','Shinrarta · Jameson','BUY · SUPPLY 21K','49,880 CR']],
              side:[['COMMODITY','TRITIUM'],['CARGO','128 T'],['PROFIT / TRIP','1.77 M CR'],['DATA SOURCE','EDDN'],['STATIONS','214']],
              carry:'Cargo capacity is read from the ship build so the profit per trip is real, not theoretical.' },
            { id:'codex', ab:'CX', n:'Codex & Almanac', grp:'REFERENCE', tab:'CODEX', pin:0, k:'',
              d:'Every hull, module, suit, weapon and material.',
              crumb:'ALMANAC 0.2.2 · 4,180 ENTRIES', sub:['SHIPS','MODULES','EQUIPMENT','MATERIALS','LORE'],
              act:['SEARCH'], lhd:'RECENTLY VIEWED', rhd:'LIBRARY',
              stats:[['SHIPS','48',0],['MODULES','1,904',0],['EQUIPMENT','214',0],['MATERIALS','412',1]],
              rows:[['FC','Federal Corvette','LARGE · COMBAT','2019 · 8 SLOTS'],['DS','Dominator Suit','TACTICAL SUIT','G1–G5'],['OP','Manticore Oppressor','PLASMA RIFLE','G1–G5'],['RD','RDX','GRADE 3 MATERIAL','MANUFACTURED']],
              side:[['LIBRARY VERSION','0.2.2'],['ENTRIES','4,180'],['ILLUSTRATIONS','27 / 48'],['LAST UPDATE','2 D AGO'],['LICENCE','MIT']],
              carry:'Every value in every other tool links back to its codex entry, so numbers are always traceable.' }
          ];
          const BUILDS = [
            ['Titan Hunter','SHIP BUILDER · FEDERAL CORVETTE','UNSAVED'],
            ['Groundpounder','EQUIPMENT BUILDER · DOMINATOR G5','3 D AGO'],
            ['Deep Space Runner','SHIP BUILDER · ANACONDA','2 D AGO'],
            ['Silent Entry','EQUIPMENT BUILDER · MAVERICK G4','1 WK AGO']
          ];
          const JUMPS = [
            ['Cocijo','THARGOID WAR TRACKER · TITAN','HEART EXPOSED'],
            ['Shinrarta Dezhra','ROUTE PLANNER · SYSTEM','JAMESON MEMORIAL'],
            ['Felicity Farseer','ENGINEER DIRECTORY','GRADE 5 UNLOCKED']
          ];

          let cur = 'foot', drawer = false, grid = false, more = false, menu = false, actmenu = false;
          const tool = () => TOOLS.find(t => t.id === cur);

          const railBtn = t => {
            const on = t.id === cur;
            return '<div class="nv-rb" data-t="' + t.id + '" title="' + t.n + '" style="height:44px;display:flex;align-items:center;gap:0;justify-content:center;position:relative;cursor:pointer;background:' + (on ? 'var(--amber-a16)' : 'transparent') + '">'
              + (on ? '<div style="position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--amber)"></div>' : '')
              + '<div style="font:700 10px/1 \'JetBrains Mono\',monospace;letter-spacing:.06em;color:' + (on ? 'var(--amber-3)' : 'var(--ink-45)') + '">' + t.ab + '</div></div>';
          };
          const statCells = t => t.stats.map(s => '<div style="padding:12px 14px;background:#131313"><div style="font:500 8px/1 \'JetBrains Mono\',monospace;color:var(--ink-42);letter-spacing:.14em">' + s[0] + '</div>'
            + '<div style="font:600 20px/1 \'Barlow Condensed\',sans-serif;letter-spacing:.05em;color:' + (s[2] ? 'var(--amber-3)' : 'var(--ink)') + ';margin-top:9px">' + s[1] + '</div></div>').join('');
          const rowList = t => t.rows.map(r => '<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:#131313">'
            + '<div style="width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--amber-a1);font:700 9px/1 \'JetBrains Mono\',monospace;color:var(--ink-7)">' + r[0] + '</div>'
            + '<div style="flex:1;min-width:0"><div style="font:500 13px/1.2 Barlow,sans-serif;color:var(--ink-2)">' + r[1] + '</div>'
            + '<div style="font:400 8.5px/1 \'JetBrains Mono\',monospace;color:var(--ink-45);margin-top:6px;letter-spacing:.1em">' + r[2] + '</div></div>'
            + '<div style="font:500 11px/1 \'JetBrains Mono\',monospace;color:var(--amber-3)">' + r[3] + '</div></div>').join('');
          const sideList = t => t.side.map(r => '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><div style="font:400 10.5px/1.3 Barlow,sans-serif;color:var(--ink-55)">' + r[0] + '</div>'
            + '<div style="font:500 11px/1 \'JetBrains Mono\',monospace;color:var(--amber-3)">' + r[1] + '</div></div>').join('');
          const actBtns = t => t.act.map((a, i) => {
            const solid = i === t.act.length - 1;
            return '<div style="height:32px;display:flex;align-items:center;padding:0 ' + (solid ? '18' : '14') + 'px;' + (solid ? 'background:var(--amber);color:var(--bg);font-weight:700' : 'border:1px solid var(--amber-a35);color:var(--amber-2);font-weight:600') + ';font-family:\'Barlow Condensed\',sans-serif;font-size:10px;line-height:1;letter-spacing:.18em">' + a + '</div>';
          }).join('');
          const subTabs = t => t.sub.map((s, i) => '<div style="display:flex;align-items:center;padding:0 15px;font:600 10px/1 \'Barlow Condensed\',sans-serif;letter-spacing:.18em;color:' + (i === 1 || (t.sub.length < 5 && i === 0) ? 'var(--amber-3)' : 'var(--ink-45)') + ';border-bottom:2px solid ' + (i === 1 || (t.sub.length < 5 && i === 0) ? 'var(--amber)' : 'transparent') + '">' + s + '</div>').join('');

          const render = () => {
            const t = tool();
            if ($('#nv-rail')) {
            $('#nv-rail').innerHTML = TOOLS.map(railBtn).join('');
            $('#nv-drawer').style.display = drawer ? 'flex' : 'none';
            const grps = [];
            TOOLS.forEach(x => { if (grps.indexOf(x.grp) < 0) grps.push(x.grp); });
            $('#nv-drawer-list').innerHTML = grps.map(g => '<div style="padding:11px 16px 7px;font:500 8.5px/1 \'JetBrains Mono\',monospace;color:var(--ink-38);letter-spacing:.16em">' + g + '</div>'
              + TOOLS.filter(x => x.grp === g).map(x => {
                const on = x.id === cur;
                return '<div class="nv-rb" data-t="' + x.id + '" style="display:flex;align-items:center;gap:11px;padding:11px 16px;cursor:pointer;border-left:3px solid ' + (on ? 'var(--amber)' : 'transparent') + ';background:' + (on ? 'linear-gradient(90deg,var(--amber-a16),transparent)' : 'transparent') + '">'
                  + '<div style="width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--amber-a25);font:700 8.5px/1 \'JetBrains Mono\',monospace;color:' + (on ? 'var(--amber-3)' : 'var(--ink-55)') + '">' + x.ab + '</div>'
                  + '<div style="flex:1;min-width:0"><div style="font:500 12.5px/1.2 Barlow,sans-serif;color:' + (on ? 'var(--amber-3)' : 'var(--ink-2)') + '">' + x.n + '</div></div>'
                  + (x.k ? '<div style="font:400 8px/1 \'JetBrains Mono\',monospace;color:var(--ink-32)">' + x.k + '</div>' : '') + '</div>';
              }).join('')).join('');
            $('#nv-title').textContent = t.n.toUpperCase();
            $('#nv-crumb').textContent = t.crumb;
            $('#nv-actions').innerHTML = actBtns(t);
            $('#nv-sub').innerHTML = subTabs(t);
            $('#nv-stats').innerHTML = statCells(t);
            $('#nv-rows').innerHTML = rowList(t);
            $('#nv-side').innerHTML = sideList(t);
            $('#nv-lhd').textContent = t.lhd;
            $('#nv-rhd').textContent = t.rhd;
            $('#nv-carry').textContent = t.carry;
            }

            // ---- turn 4: merged toolbar variants ----
            const tabStrip = (all, big) => TOOLS.filter(x => all || x.pin).map(x => {
              const on = x.id === cur;
              return '<div class="nv-rb" data-t="' + x.id + '" style="display:flex;flex:none;align-items:center;padding:0 ' + (big ? 14 : 12) + 'px;cursor:pointer;background:' + (on ? 'var(--amber-a14)' : 'transparent') + ';border-bottom:2px solid ' + (on ? 'var(--amber)' : 'transparent') + ';font:700 ' + (big ? 12 : 10.5) + 'px/1 \'Barlow Condensed\',sans-serif;letter-spacing:.16em;white-space:nowrap;color:' + (on ? 'var(--amber-3)' : 'var(--ink-48)') + '">' + (big && on && !all ? x.n.toUpperCase() : x.tab) + '</div>';
            }).join('');
            const subStrip = (t2, tight) => t2.sub.map((s, i) => {
              const on = i === 1 || (t2.sub.length < 5 && i === 0);
              return '<div style="display:flex;align-items:center;padding:0 ' + (tight ? 12 : 15) + 'px;white-space:nowrap;font:600 ' + (tight ? 9.5 : 10) + 'px/1 \'Barlow Condensed\',sans-serif;letter-spacing:.18em;color:' + (on ? 'var(--amber-3)' : 'var(--ink-45)') + ';border-bottom:2px solid ' + (on ? 'var(--amber)' : 'transparent') + '">' + s + '</div>';
            }).join('');
            const fill = (p, body) => {
              if (!$('#' + p + '-stats')) return;
              $('#' + p + '-stats').innerHTML = statCells(t);
              $('#' + p + '-rows').innerHTML = rowList(t);
              $('#' + p + '-side').innerHTML = sideList(t);
              $('#' + p + '-lhd').textContent = t.lhd;
              $('#' + p + '-rhd').textContent = t.rhd;
              $('#' + p + '-act').innerHTML = actBtns(t);
            };
            if ($('#m-tabs')) {
              $('#m-tabs').innerHTML = TOOLS.filter(x => x.pin).map(x => {
                const on = x.id === cur;
                return '<div class="nv-rb" data-t="' + x.id + '" style="display:flex;flex:none;align-items:center;padding:0 10px;cursor:pointer;background:' + (on ? 'var(--amber-a14)' : 'transparent') + ';border-bottom:2px solid ' + (on ? 'var(--amber)' : 'transparent') + ';font:700 10px/1 \'Barlow Condensed\',sans-serif;letter-spacing:.14em;white-space:nowrap;color:' + (on ? 'var(--amber-3)' : 'var(--ink-48)') + '">' + x.tab + '</div>';
              }).join('');
              $('#m-title').textContent = t.n.toUpperCase();
              $('#m-crumb').textContent = t.crumb;
              $('#m-lhd').textContent = t.lhd;
              $('#m-rhd').textContent = t.rhd;
              $('#m-stats').innerHTML = t.stats.slice(0, 4).map(s => '<div style="padding:11px 12px;background:#131313"><div style="font:500 7.5px/1 \'JetBrains Mono\',monospace;color:var(--ink-42);letter-spacing:.14em">' + s[0] + '</div>'
                + '<div style="font:600 19px/1 \'Barlow Condensed\',sans-serif;letter-spacing:.05em;color:' + (s[2] ? 'var(--amber-3)' : 'var(--ink)') + ';margin-top:8px">' + s[1] + '</div></div>').join('');
              $('#m-rows').innerHTML = t.rows.slice(0, 4).map(r => '<div style="display:flex;align-items:center;gap:11px;padding:11px 12px;background:#131313">'
                + '<div style="width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--amber-a1);font:700 8.5px/1 \'JetBrains Mono\',monospace;color:var(--ink-7)">' + r[0] + '</div>'
                + '<div style="flex:1;min-width:0"><div style="font:500 12.5px/1.2 Barlow,sans-serif;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + r[1] + '</div>'
                + '<div style="font:400 8px/1 \'JetBrains Mono\',monospace;color:var(--ink-45);margin-top:5px;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + r[2] + '</div></div>'
                + '<div style="font:500 10.5px/1 \'JetBrains Mono\',monospace;color:var(--amber-3);flex:none">' + r[3] + '</div></div>').join('');
              $('#m-side').innerHTML = t.side.slice(0, 3).map(r => '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><div style="font:400 10.5px/1.3 Barlow,sans-serif;color:var(--ink-55)">' + r[0] + '</div>'
                + '<div style="font:500 11px/1 \'JetBrains Mono\',monospace;color:var(--amber-3)">' + r[1] + '</div></div>').join('');
              $('#m-actmenu').style.display = actmenu ? 'block' : 'none';
              $('#m-actmenu').innerHTML = t.act.slice().reverse().concat(['HELP']).map((a, i) => '<div style="display:flex;align-items:center;height:46px;padding:0 14px;cursor:pointer;background:' + (i === 0 ? 'var(--amber-a12)' : 'transparent') + ';font:700 12px/1 \'Barlow Condensed\',sans-serif;letter-spacing:.18em;color:' + (i === 0 ? 'var(--amber-3)' : 'var(--ink-2)') + ';border-bottom:1px solid var(--amber-a12)">' + a + '</div>').join('');
            }
            if ($('#v3-tabs')) {
              $('#v3-tabs').innerHTML = tabStrip(more, false);
              $('#v3-more').textContent = more ? '✕' : '⋯';
              $('#v3-title').textContent = t.n.toUpperCase();
              $('#v3-crumb').textContent = t.crumb;
              $('#v3-sub').innerHTML = '';
              fill('v3');
            }

            if ($('#nv-q')) renderPalette();
          };

          const pRow = (ab, name, meta, right, on) => '<div class="nv-pr" style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;border-left:2px solid ' + (on ? 'var(--amber)' : 'transparent') + ';background:' + (on ? 'linear-gradient(90deg,var(--amber-a14),transparent)' : 'transparent') + '">'
            + '<div style="width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--amber-a25);font:700 8px/1 \'JetBrains Mono\',monospace;color:' + (on ? 'var(--amber-3)' : 'var(--ink-55)') + '">' + ab + '</div>'
            + '<div style="flex:1;min-width:0"><div style="font:500 13px/1.2 Barlow,sans-serif;color:' + (on ? 'var(--amber-3)' : 'var(--ink-2)') + '">' + name + '</div>'
            + '<div style="font:400 8.5px/1 \'JetBrains Mono\',monospace;color:var(--ink-42);margin-top:5px;letter-spacing:.1em">' + meta + '</div></div>'
            + (right ? '<div style="font:400 8.5px/1 \'JetBrains Mono\',monospace;color:var(--ink-38);letter-spacing:.1em">' + right + '</div>' : '') + '</div>';
          const pHead = l => '<div style="padding:9px 16px;background:var(--panel-2);border-bottom:1px solid var(--amber-a16);font:500 8.5px/1 \'JetBrains Mono\',monospace;color:var(--ink-42);letter-spacing:.16em">' + l + '</div>';

          const renderPalette = () => {
            const q = ($('#nv-q').value || '').trim().toLowerCase();
            const hit = s => s.toLowerCase().indexOf(q) > -1;
            const tl = TOOLS.filter(x => !q || hit(x.n) || hit(x.grp) || hit(x.d));
            const bl = BUILDS.filter(b => !q || hit(b[0]) || hit(b[1]));
            const jl = JUMPS.filter(j => !q || hit(j[0]) || hit(j[1]));
            let html = '', first = true, n = 0;
            if (tl.length) { html += pHead('TOOLS'); html += tl.map(x => { const on = first; first = false; n++; return pRow(x.ab, x.n, x.grp + ' · ' + x.d, x.k || 'OPEN', on); }).join(''); }
            if (bl.length) { html += pHead('SAVED BUILDS'); html += bl.map(b => { const on = first; first = false; n++; return pRow('BD', b[0], b[1], b[2], on); }).join(''); }
            if (jl.length) { html += pHead('JUMP TO'); html += jl.map(j => { const on = first; first = false; n++; return pRow('→', j[0], j[1], j[2], on); }).join(''); }
            $('#nv-results').innerHTML = html;
            $('#nv-results').style.display = n ? 'block' : 'none';
            $('#nv-empty').style.display = n ? 'none' : 'block';
            $('#nv-count').textContent = n ? n + ' RESULTS' : '';
          };

          if ($('#nv-q')) $('#nv-q').addEventListener('input', renderPalette);
          sec.addEventListener('click', e => {
            const b = e.target.closest('.nv-rb');
            if (b) { cur = b.dataset.t; grid = false; menu = false; render(); return; }
            if (e.target.closest('#v1-more') || e.target.closest('#v3-more')) { more = !more; render(); return; }
            if (e.target.closest('#m-actmore')) { actmenu = !actmenu; render(); return; }
            if (actmenu && !e.target.closest('#m-actmenu')) { actmenu = false; render(); }
            if (menu && !e.target.closest('#v2-menu')) { menu = false; render(); }
            if (e.target.closest('#nv-drawer-btn')) { drawer = !drawer; render(); return; }
            if (e.target.closest('#nv-grid-btn')) { grid = !grid; render(); return; }
            if (grid && !e.target.closest('#nv-grid')) { grid = false; render(); }
          });

          render();
        }

        componentDidMount() { this.wireNav(); }
        componentDidUpdate() { this.wireNav(); }
      }
    </script>
  </body>
</html>
