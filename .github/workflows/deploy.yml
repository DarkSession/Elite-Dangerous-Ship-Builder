# Publishes the production build to GitHub Pages at https://sb.edct.dev/.
#
# The application is client-side only, so a deployment is nothing more than the
# static output of `pnpm run build` handed to Pages. Nothing is built on the
# host and no server runs there.
#
# Automatic deployment is the final job in `ci.yml`, so its source, checks,
# artifact and publication all belong to the same trusted push. This workflow is
# the manual recovery path for republishing `main`, useful after changing the
# Pages settings. It verifies the exact commit's CI gate and republishes that
# run's retained Pages artifact; no repository code executes here.
name: Deploy manually

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# One deployment at a time, and never cancel one in flight: a half-finished
# publish would leave the site on a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  recover-artifact:
    name: Recover artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Unsupported deployment ref::Manual deployment accepts refs/heads/main; received $GITHUB_REF."
            exit 1
          fi

      # Ignore only the deployment job: it is the stage this workflow exists to
      # retry. Every present and future non-deployment job that ran must have
      # succeeded; an intentional skip is neutral, while a failed dependency is
      # rejected by its own conclusion. New CI jobs join this gate automatically.
      - name: Find the successful CI gate
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f event=push \
            -f status=completed \
            -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "::error title=CI evidence unavailable::No completed CI push run exists for commit $GITHUB_SHA."
            exit 1
          fi

          run_record="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '[.head_sha, .conclusion] | @tsv')"
          IFS=$'\t' read -r run_sha run_conclusion <<< "$run_record"
          gate_failures="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            -f filter=all \
            -f per_page=100 \
            --paginate \
            --slurp | \
            jq -r '[.[].jobs[] | select(.name != "Deploy")] | group_by(.name) | map(max_by(.run_attempt)) as $jobs | if ($jobs | length) == 0 then "no non-deployment jobs found" else [$jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | (.name + "=" + (.conclusion // "not-completed"))] | join(", ") end')"
          if [ "$run_sha" != "$GITHUB_SHA" ]; then
            echo "::error title=CI run mismatch::CI run $run_id belongs to commit $run_sha, not requested commit $GITHUB_SHA."
            exit 1
          fi
          if [ "$run_conclusion" = "cancelled" ]; then
            echo "::error title=CI run cancelled::CI run $run_id was cancelled, so skipped jobs cannot prove that the complete gate ran."
            exit 1
          fi
          if [ -n "$gate_failures" ]; then
            echo "::error title=CI gate not successful::CI run $run_id has non-successful jobs: $gate_failures."
            exit 1
          fi

          artifact_record="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            -f per_page=100 \
            --paginate \
            --slurp | \
            jq -r '[.[].artifacts[] | select(.name == "github-pages" and .expired == false)] as $artifacts | if ($artifacts | length) == 0 then ["0", ""] else [($artifacts | length | tostring), ($artifacts | max_by(.id) | .id | tostring)] end | @tsv')"
          IFS=$'\t' read -r artifact_count artifact_id <<< "$artifact_record"
          if [ "$artifact_count" = "0" ]; then
            echo "::error title=Pages artifact unavailable::CI run $run_id has no retained github-pages artifact. Re-run CI on main to regenerate it, then run this recovery workflow again."
            exit 1
          fi
          if [ "$artifact_count" -gt 1 ]; then
            echo "::notice title=Newest Pages artifact selected::CI run $run_id has $artifact_count retained github-pages artifacts across attempts; selecting newest artifact ID $artifact_id."
          fi

          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact-id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "::notice title=CI evidence accepted::Reusing the Pages artifact from CI run $run_id for commit $GITHUB_SHA."

      - name: Download the validated Pages artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.ci-run.outputs.artifact-id }}
          path: ${{ runner.temp }}/pages-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci-run.outputs.run-id }}

      # deploy-pages reads artifacts from its own workflow run. Re-upload only
      # the Pages archive itself, not any other file the source artifact held.
      - name: Attach the Pages artifact to this run
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: recover-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `pages` and `id-token` are what actions/deploy-pages needs to publish and
    # to prove the artifact came from this workflow run.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # A newer push may land while the retained artifact is being recovered.
      # Do not let this path publish the older commit after that happens.
      - name: Confirm this is still the main branch tip
        id: main-tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment skipped::Recovery commit $GITHUB_SHA is no longer the main branch tip $current_sha."
            echo "Deployment skipped: recovery commit $GITHUB_SHA is no longer the main branch tip $current_sha." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure GitHub Pages
        if: ${{ steps.main-tip.outputs.current == 'true' }}
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        if: ${{ steps.main-tip.outputs.current == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5
