# Publishes the production build to GitHub Pages at https://sb.edct.dev/.
#
# The application is client-side only, so a deployment is nothing more than the
# static output of `pnpm run build` handed to Pages. Nothing is built on the
# host and no server runs there.
#
# Deployment is gated on CI: this workflow starts only once the `CI` workflow
# has finished for a commit on `main`, and stops unless that run succeeded, so
# a build that fails the checks is never published. `workflow_dispatch` publishes
# the ref it is dispatched from — useful after changing the Pages settings — and
# runs the checks itself, because there is no CI result to lean on.
#
# A `workflow_run` job runs in the context of the default branch: it holds this
# repository's token and can write the cache scope every later run on `main`
# reads from. So the one question this file has to answer correctly is *whose commit
# it is about to build*, and the answer is settled by the `if:` on the build job
# rather than by the `branches:` filter below, which cannot settle it. See the
# comment there before changing either.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a half-finished
# publish would leave the site on a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # `workflow_run` fires for every conclusion and for every event that started
    # the run that finished, a pull request from a fork included — and none of
    # the payload's branch fields is a trust boundary. `head_branch` is the
    # branch name in whichever repository opened the pull request, so a fork
    # with a branch called `main` satisfies the `branches:` filter above, and a
    # pull request author chooses both that name and the commit the filter would
    # then wave through. A job that checked only the conclusion would build and
    # publish that commit, because a pull request's author also controls whether
    # its CI passes.
    #
    # What an author cannot forge is the event that started the CI run, or the
    # repository the commit came from. `head_repository` is that repository —
    # not `repository`, which is always this one and so would check nothing. A
    # pull request's CI run carries `pull_request` in `event`, a re-run keeps
    # the event it was started with, and a fork's own pushes raise runs in the
    # fork that never reach this workflow. So a `push` run of CI for this
    # repository is one that a writer created. `head_branch` is checked as
    # well, and it is the clause that still holds if CI's own triggers are ever
    # widened.
    #
    # That settles whose commit is about to be built. It does not settle that
    # the commit is still the tip: re-running an old CI run deploys the commit
    # that run was for, rolling the site back to it. Re-running needs
    # `actions: write`, so that is a footgun for us rather than a way in.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    # Generous enough for the manual path, which runs the whole `check` gate,
    # end-to-end suite included.
    timeout-minutes: 40

    steps:
      # `workflow_run` runs against the default branch, not against the commit
      # that triggered CI, so the commit CI passed on is checked out explicitly.
      # On a manual run the ref is whatever was dispatched. The `if:` above is
      # what makes this ref trustworthy; it is not trustworthy on its own.
      #
      # The token is not written into `.git/config`: everything after this step
      # runs the checked-out project's own scripts, and none of them has any
      # business with a credential that can reach this repository.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      # The version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # No dependency cache here, deliberately. This is the one workflow that
      # runs in the default branch's context, and an entry written from there is
      # readable by every later run on `main` — somewhere to leave something
      # behind for the next deployment to restore and execute.
      #
      # Dropping it is not what keeps that scope clean; the `if:` above is. Any
      # step in this job holds the token the cache service accepts, so code
      # running here could write an entry whether or not a step asked for one.
      # What dropping it buys is that the workflow puts nothing in that scope of
      # its own accord. CI keeps its cache, which is where an install repeats
      # often enough to be worth caching; a deployment runs a few times a day
      # and can afford a cold one.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The commit already passed CI, so only the build is repeated here to
      # produce the files to publish.
      - name: Build
        run: pnpm run build
        if: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Install Playwright browsers
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: pnpm exec playwright install --with-deps chromium firefox

      # A manual run has no CI result behind it, so it earns green the same way
      # a pushed commit does before anything reaches the site. `check` builds as
      # part of the gate, which is why the plain build step is skipped here. It
      # reports as one step rather than naming the stage that broke — the CI
      # workflow is where a failure is diagnosed; this path is the escape hatch.
      - name: Check and build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: pnpm run check

      # Pages serves its own 404 page for any path that is not a file, which
      # would break a deep link into a client-side route. Serving the
      # application from 404.html instead hands those paths to the router,
      # which resolves them without a redirect or a hash fragment. `index.html`
      # already carries `<base href="/">`, correct for a domain of our own.
      - name: Serve client-side routes from the 404 page
        run: cp dist/elite-dangerous-ship-builder/browser/index.html dist/elite-dangerous-ship-builder/browser/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # `public/CNAME` names the custom domain and is copied into the build by
      # the asset glob in angular.json, so the domain survives every deployment.
      - name: Upload the build as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/elite-dangerous-ship-builder/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `pages` and `id-token` are what actions/deploy-pages needs to publish and
    # to prove the artifact came from this workflow run.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
