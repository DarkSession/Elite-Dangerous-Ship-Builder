# Runs the gate `pnpm run check` runs, split into individual steps so a failure
# names the stage that broke: formatting, types, the script tests, build, unit
# tests (with the 80% coverage thresholds from angular.json) and the Playwright
# end-to-end suite across the desktop, tablet and mobile viewports. It has one
# stage of its own, between the checks and the build: the version stamp, which
# only a deployable build needs.
#
# The end-to-end suite is **sharded across parallel jobs**, which is the one
# thing the verification contract permits a CI run to do with the matrix: shard
# it, never reduce it. Every shard loads the same ten projects and between them
# they run every test exactly once. The suite is ~96 minutes of work; six shards
# of two workers put it inside a job budget, where a single job of two workers
# reached only about half of it before the timeout. The width is on the shard
# axis rather than the worker axis because a shard is another runner with its
# own cores, and a fourth worker on a four-vCPU box only starves the other
# three — see the note on `workers` in `playwright.config.ts`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One place to change the shard count. It is read by the job matrix below and
  # by `playwright.config.ts`, and the two must agree or the run silently covers
  # a fraction of the suite while reporting green.
  E2E_SHARDS: 6

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The build version's patch is a count of commits, so this job needs
          # the whole history rather than the single commit the default fetch
          # provides. No other job resolves a version, and none of them fetch it.
          fetch-depth: 0

      # Installed before setup-node so the `pnpm` cache backend can resolve the
      # store path. The version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # `package.json` declares `major.minor.0`; the patch is the number of
      # commits since that major.minor was declared, resolved here and stamped
      # into the manifest the build is about to read. Nothing is committed back:
      # a push to `main` from inside this run would move the branch tip out from
      # under the deploy job's own tip check below, and the publish would skip
      # itself. Because the number counts commits rather than runs, re-running
      # CI on this commit resolves the same version, and so does the manual
      # republish in `deploy.yml`, which re-publishes this run's artifact.
      #
      # The stamp runs after `format:check` and `typecheck`, which read the
      # manifest as committed, and before `build`, which is what carries the
      # value into the bundle through
      # `src/app/platform/build/application-metadata.ts`. It is not release
      # evidence: a release is declared only by `SHIP_BUILDER_RELEASE_TAG`
      # matching the shipped version, which no workflow sets.
      # The resolver decides what every deployment is called, and a defect that
      # makes it count less history still exits successfully — so its own tests
      # run here, before it does.
      - name: Script tests
        run: pnpm run test:scripts

      - name: Stamp the build version
        run: |
          version="$(node scripts/resolve-build-version.mjs --write)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::notice title=Build version::$version"
            echo "Deployed as version \`$version\`." >> "$GITHUB_STEP_SUMMARY"
          else
            # A pull request builds its merge commit, whose commit count is not
            # the one `main` will resolve once this lands. The stamp still runs,
            # because a resolver that only ever runs on `main` is a resolver
            # whose failures are only ever found on `main`.
            echo "Built as version \`$version\`, which is this merge commit's count and not the one" \
              "\`main\` resolves when the change lands." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

      # A push to `main` is the deployment's build run too. Packaging the output
      # here keeps the source, checks and Pages artifact on one trusted event and
      # avoids checking out a SHA supplied by a later `workflow_run` event.
      - name: Serve client-side routes from the 404 page
        if: ${{ github.event_name == 'push' }}
        run: cp dist/elite-dangerous-ship-builder/browser/index.html dist/elite-dangerous-ship-builder/browser/404.html

      - name: Upload the build as a Pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/elite-dangerous-ship-builder/browser
          # Keep one known-good artifact available to the manual recovery
          # workflow without rebuilding or executing repository code there.
          # v5 declares this input directly; 90 days is this repository's
          # configured maximum for Actions artifacts.
          retention-days: 90

      - name: Upload unit test coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          # Absent whenever the job fails before the unit tests run, which is
          # too common to warn about. A reporter misconfiguration would be
          # silent here too; the thresholds in angular.json do not cover that.
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-end (shard ${{ matrix.shard }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # Every shard runs to completion. A failure in one is a failure of the
      # run, but cancelling the others would throw away the evidence of what
      # else broke — which is the whole point of running the full matrix.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Two engine downloads per shard is the same bytes fetched four times.
      # Keyed on the lockfile because that is what pins the Playwright version
      # the browser builds have to match.
      - name: Restore the browser cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` adds the system libraries the runner image lacks. Those
      # live outside the cached directory, so they are installed on every run;
      # only the browser builds themselves are skipped on a hit.
      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium firefox
          else
            pnpm exec playwright install --with-deps chromium firefox
          fi

      # The shard is passed in the environment, not as an argument: `pnpm run
      # e2e -- --shard=1/4` forwards the bare `--`, Playwright reads the flag as
      # a filename filter, and the shard reports a green run over zero tests.
      # `PLAYWRIGHT_SHARD` also switches the reporter to `blob`, which the report
      # job below merges — otherwise each shard writes its own partial HTML
      # report and the last upload wins.
      - name: End-to-end tests
        run: pnpm run e2e
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}

      - name: Upload the shard's report data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  e2e-report:
    name: End-to-end report
    # Runs on failure too: a red run is exactly when someone needs the report.
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Report a skipped end-to-end suite
        if: ${{ needs.e2e.result == 'skipped' }}
        run: |
          echo "::error title=End-to-end suite not run::The Check job did not succeed, so the end-to-end jobs were skipped."
          exit 1

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download every shard's report data
        uses: actions/download-artifact@v7
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the Playwright report
        if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          # Absent whenever every shard failed before writing any blob.
          if-no-files-found: ignore
          retention-days: 7

      # The report job runs on a failed shard so it can preserve the evidence.
      # Carry that failure forward after the report is uploaded so this job's
      # own conclusion remains honest even though it also runs on failure.
      - name: Preserve a failed end-to-end result
        if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
        run: exit 1

  deploy:
    name: Deploy
    # Pull requests run the same checks but never publish. `push` is already
    # restricted to `main` by this workflow's trigger.
    if: ${{ github.event_name == 'push' }}
    needs: [check, e2e, e2e-report]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Share the deployment lock with the manual workflow and never interrupt a
    # publication that has already begun.
    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Concurrency prevents two publications from overlapping but does not
      # promise FIFO ordering. Check after acquiring that lock so an older run
      # that finished late cannot replace a newer deployment.
      - name: Confirm this is still the main branch tip
        id: main-tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment skipped::CI commit $GITHUB_SHA is no longer the main branch tip $current_sha."
            echo "Deployment skipped: CI commit $GITHUB_SHA is no longer the main branch tip $current_sha." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure GitHub Pages
        if: ${{ steps.main-tip.outputs.current == 'true' }}
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        if: ${{ steps.main-tip.outputs.current == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5
