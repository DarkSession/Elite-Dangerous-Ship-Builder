# Runs the same gate as `pnpm run check`, split into individual steps so a
# failure names the stage that broke: formatting, types, build, unit tests
# (with the 80% coverage thresholds from angular.json) and the Playwright
# end-to-end suite across the desktop, tablet and mobile viewports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Installed before setup-node so the `pnpm` cache backend can resolve the
      # store path. The version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

      # Downloading a browser costs more than every step above it combined, so
      # it waits until they have passed. Every Playwright project drives
      # Chromium, so only that browser is needed; `--with-deps` adds the system
      # libraries the runner image lacks.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run e2e

      - name: Upload unit test coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          # Absent whenever the job fails before the unit tests run. A reporter
          # that stopped emitting would fail the coverage thresholds anyway.
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            dist/e2e-results/
          # Absent whenever the job fails before the end-to-end tests run.
          if-no-files-found: ignore
          retention-days: 7
