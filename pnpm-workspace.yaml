# pnpm settings. This project is a single package, so the file declares no
# `packages:` list; it exists for the settings below.

# A version must be published for seven days (10080 minutes) before an install
# may resolve it. The delay gives a compromised or withdrawn release time to be
# found and pulled before this project can reach it.
minimumReleaseAge: 10080

# `minimumReleaseAgeExclude` takes two shapes. A bare name or pattern exempts
# every release of a package. A `name@version` entry exempts one release.
#
# Almanac is the source of truth for game data and calculations. A feature here
# waits on its releases, so this project installs one the day it ships.
#
# fast-uri 3.1.7 closes GHSA-qw65-cvwx-89v3 and GHSA-58mr-gqgx-xq4g, and it is
# younger than the delay. Without the entry `pnpm update` silently resolves
# 3.1.6 and reopens both. Delete the entry once 3.1.7 is seven days old.
minimumReleaseAgeExclude:
  - '@elite-dangerous-almanac/*'
  - 'fast-uri@3.1.7'
